<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/js/phone-fit.js"></script>
<title>Renew — Poolside</title>
<script src="/js/pooltime.js"></script>
<script src="/js/plan-picker.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="/js/renew-sign.js"></script>
<script src="/js/errors.js" defer></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" id="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" id="meta-theme-color" content="#0a3b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="meta-apple-title" content="Poolside">
<script src="/js/pwa.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#0a3b5c; --blue-2:#134b73; --blue-l:#e6eef5; --sun:#f59e0b;
    --bg:#fefdfb; --bg-2:#f7f3eb; --text:#0f172a; --muted:#5d6b81;
    --border:#e5e7eb; --green:#16a34a; --red:#dc2626;
    --shadow: 0 1px 2px rgba(10,59,92,.04), 0 8px 24px rgba(10,59,92,.06);
    --r-md: 12px; --r-lg: 18px;
  }
  *,*::before,*::after { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 'Inter', system-ui, sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
  a { color: var(--blue); }
  h1, h2, h3 { font-family:'Fraunces', Georgia, serif; font-weight:600; letter-spacing:-.015em; margin:0; }
  h1 { font-size: 26px; }
  h2 { font-size: 18px; margin-bottom: 10px; }
  .logo { display:inline-flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:var(--blue); text-decoration:none; }
  .logo-dot { width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--sun),#fbbf24); box-shadow:0 0 0 3px rgba(245,158,11,.18); }
  header { padding:14px 22px; border-bottom:1px solid var(--border); background:#fff; display:flex; justify-content:space-between; align-items:center; }
  .who { font-size:13px; color:var(--muted); display:flex; gap:14px; align-items:center; }
  .who a { cursor:pointer; }
  main { flex:1; padding:22px 16px 40px; max-width:640px; width:100%; margin:0 auto; }
  .back { display:inline-flex; align-items:center; gap:6px; font:600 13px 'Inter'; color:var(--blue); text-decoration:none; padding:8px 0 16px; }
  footer { padding:18px; text-align:center; font-size:12px; color:var(--muted); }

  .card { background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); padding:20px 22px; margin-bottom:14px; box-shadow:var(--shadow); }

  /* Amount hero — the one number the member came here for. */
  .amount { font-family:'Fraunces',serif; font-size:40px; font-weight:600; color:var(--blue); letter-spacing:-.02em; line-height:1; }
  .amount-sub { color:var(--muted); font-size:13.5px; margin-top:6px; }

  /* The club's deadlines, stated as reassurance rather than a warning. */
  .rules { background:var(--blue-l); border-radius:var(--r-md); padding:13px 15px; font-size:13.5px; color:var(--blue); margin-top:14px; }
  .rules b { font-weight:600; }

  .opt { display:flex; gap:12px; align-items:flex-start; padding:14px; border:1.5px solid var(--border); border-radius:var(--r-md); cursor:pointer; margin-bottom:10px; background:#fff; }
  .opt:hover { border-color:var(--blue); }
  .opt.sel { border-color:var(--blue); background:var(--blue-l); }
  .opt input { margin:3px 0 0; accent-color:var(--blue); width:18px; height:18px; flex:none; }
  .opt-title { font-weight:600; font-size:15px; }
  .opt-sub { color:var(--muted); font-size:13px; margin-top:2px; }

  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 16px; }
  .chip { padding:9px 15px; border:1.5px solid var(--border); border-radius:999px; background:#fff; font:600 13px 'Inter'; color:var(--text); cursor:pointer; }
  .chip:hover { border-color:var(--blue); }
  .chip.sel { background:var(--blue); border-color:var(--blue); color:#fff; }

  table.sched { width:100%; border-collapse:collapse; font-size:14px; }
  table.sched th { text-align:left; font:600 11px 'Inter'; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding-bottom:8px; }
  table.sched td { padding:9px 0; border-top:1px solid var(--border); font-variant-numeric:tabular-nums; }
  table.sched td.amt { text-align:right; font-weight:600; }
  table.sched tr.milestone td { border-top:1.5px solid var(--blue); }
  .ms-note { font-size:11.5px; color:var(--blue); font-weight:600; padding-top:2px; }
  .first-note { font-size:12px; color:var(--muted); }

  .toggle { display:flex; gap:12px; align-items:flex-start; padding:14px; border:1.5px solid var(--border); border-radius:var(--r-md); background:#fff; }
  .toggle input { margin:2px 0 0; accent-color:var(--blue); width:18px; height:18px; flex:none; }

  .btn { padding:14px 22px; border-radius:var(--r-md); font:600 15px 'Inter'; cursor:pointer; border:1.5px solid transparent; background:var(--blue); color:#fff; width:100%; }
  .btn:hover { background:var(--blue-2); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .err { background:#fef2f2; border:1px solid #fecaca; color:var(--red); border-radius:var(--r-md); padding:12px 14px; font-size:13.5px; margin-bottom:12px; }
  .ok-note { color:var(--muted); font-size:12.5px; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<header>
  <a href="/m/" class="logo" id="brand-link"><span class="logo-dot"></span> <span id="brand-name">…</span></a>
  <div class="who"><span id="whoami">Loading…</span><a id="signout">Sign out</a></div>
</header>

<main>
  <a href="/m/" class="back">← My club home</a>
  <div id="root"><div class="card"><p style="color:var(--muted);font-size:14px;margin:0">Loading…</p></div></div>
</main>

<footer>Powered by <a href="https://poolsideapp.com">Poolside</a></footer>

<script>
const SUPABASE_URL = 'https://sdewylbddkcvidwosgxo.supabase.co';
const AUTH_URL     = `${SUPABASE_URL}/functions/v1/member_auth`;
const CHECKOUT_URL = `${SUPABASE_URL}/functions/v1/stripe_checkout`;

let OPTS = null;        // renewal_options response
let CODE = '';          // "Have a code?" (H5, H7)
let choice = 'full';
let CHOSE = false;       // the family picked how to pay; don't move it back to the saved card    // 'full' | 'plan'
let PLAN_SEL = {};      // the plan they picked: pay today, paid off by (PLAN.md M)
let FOB_EXTRA = null;   // extra keyfobs (PLAN.md Q); null until the first quote says

function token() { return localStorage.getItem('poolside_member_token'); }
function logout() {
  localStorage.removeItem('poolside_member_token');
  localStorage.removeItem('poolside_member_user');
  localStorage.removeItem('poolside_member_tenant');
  window.location.href = '/m/login.html';
}
document.getElementById('signout').addEventListener('click', logout);

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(cents) { return '$' + (Number(cents || 0) / 100).toFixed(2); }
function prettyDate(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString(undefined,
    { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}

async function callMember(action, extra = {}) {
  const t = token(); if (!t) { logout(); throw new Error('Not signed in'); }
  const res = await fetch(AUTH_URL, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'authorization': `Bearer ${t}` },
    body: JSON.stringify({ action, ...(extra || {}) }),
  });
  if (res.status === 401) { logout(); throw new Error('Session expired'); }
  return res.json();
}

function shell(inner) { document.getElementById('root').innerHTML = inner; }

function render() {
  const o = OPTS;
  document.getElementById('whoami').textContent = o.family_name || '';

  if (o.already_paid) {
    shell(`<div class="card">
      <h1>You're all set for ${o.year}</h1>
      <p style="color:var(--muted);font-size:14px;margin:10px 0 0">
        Your membership is paid through the ${o.year} season. Nothing to do — see you at the pool.</p>
      <p style="margin:18px 0 0"><a href="/m/" class="back" style="padding:0">← Back to my club</a></p>
    </div>`);
    return;
  }
  if (!o.open) {
    shell(`<div class="card">
      <h1>Renewals aren't open yet</h1>
      <p style="color:var(--muted);font-size:14px;margin:10px 0 0">
        Your club hasn't opened ${o.year} renewals. You'll get a note when it does — nothing to do right now.</p>
    </div>`);
    return;
  }
  const price = o.price || { base_cents: o.dues_cents, amount_due_cents: o.dues_cents, discount_cents: 0, credit_cents: 0 };
  // A discount or their referral credit can cover the whole season (H5).
  const free = price.base_cents > 0 && price.amount_due_cents === 0;
  if (!price.base_cents) {
    shell(`<div class="card">
      <h1>Renewals aren't quite ready</h1>
      <p style="color:var(--muted);font-size:14px;margin:10px 0 0">
        Your club still has to set this season's dues. Check back shortly.</p>
    </div>`);
    return;
  }

  const plansOn = !free && !!(o.plan && o.plan.available);
  // One tap with the saved card, when there is one (PLAN.md R7).
  if (!CHOSE) choice = o.last_plan && plansOn ? 'plan' : o.saved_card ? 'saved' : choice;
  if (!plansOn && choice === 'plan') choice = o.saved_card ? 'saved' : 'full';
  if (choice === 'saved' && !o.saved_card) choice = 'full';
  const goLabel = free ? 'Confirm, nothing to pay' : choice === 'plan' ? 'Start my payment plan' : choice === 'saved' ? 'Approve and pay ' + money(o.dues_cents) : 'Pay ' + money(o.dues_cents);

  shell(`
    <div class="card">
      <h1>Renew for ${o.year}</h1>
      <p style="color:var(--muted);font-size:14px;margin:8px 0 18px">
        ${esc(o.family_name || 'Your household')} · ${esc(o.tier_label)}</p>
      <div class="amount">${money(free ? 0 : o.dues_cents)}</div>
      <div class="amount-sub">${free ? 'Nothing to pay this season.' : o.pass_fee ? 'Includes the card processing fee.' : 'Total for the season.'}</div>
      ${priceLinesHtml(price)}
      ${codeHtml(price)}
    </div>

    ${fobCardHtml(price)}

    ${RenewSign.html()}

    ${free ? '' : `<div class="card">
      <h2>How would you like to pay?</h2>
      ${o.saved_card ? `
      <label class="opt ${choice === 'saved' ? 'sel' : ''}" id="opt-saved">
        <input type="radio" name="how" value="saved" ${choice === 'saved' ? 'checked' : ''}>
        <span>
          <span class="opt-title">Approve and pay ${money(o.dues_cents)} with my saved card</span>
          <span class="opt-sub">One tap. The card you kept for renewals is charged once you approve.</span>
        </span>
      </label>` : ''}
      <label class="opt ${choice === 'full' ? 'sel' : ''}" id="opt-full">
        <input type="radio" name="how" value="full" ${choice === 'full' ? 'checked' : ''}>
        <span>
          <span class="opt-title">${o.saved_card ? 'Pay in full with another card' : 'Pay in full'} — ${money(o.dues_cents)}</span>
          <span class="opt-sub">One payment today. Done for the season.</span>
        </span>
      </label>
      ${plansOn ? `
      <label class="opt ${choice === 'plan' ? 'sel' : ''}" id="opt-plan">
        <input type="radio" name="how" value="plan" ${choice === 'plan' ? 'checked' : ''}>
        <span>
          <span class="opt-title">Payment plan</span>
          <span class="opt-sub">Pay part today (or nothing) and the rest monthly, charged to your card.</span>
        </span>
      </label>` : ''}
      <div id="plan-area"></div>
    </div>`}

    ${free ? '' : `<div class="card">
      <label class="toggle">
        <input type="checkbox" id="auto-renew" ${o.auto_renew ? 'checked' : ''}>
        <span>
          <span class="opt-title">Make next season's renewal one tap</span>
          <span class="opt-sub">When ${o.year + 1} opens, we'll send you the new price and the club's policies to approve, with this card ready. Nothing is charged until you approve, and you can change how you pay then. Turn it off any time under My family.</span>
        </span>
      </label>
    </div>`}

    <div id="err"></div>
    <button class="btn" id="go">${goLabel}</button>
    ${free ? '' : '<p class="ok-note">Payments are handled by Stripe. Your card details never touch your club or Poolside.</p>'}
  `);

  document.querySelectorAll('input[name=how]').forEach(r => {
    r.addEventListener('change', () => {
      choice = r.value; CHOSE = true;
      render();
    });
  });
  document.getElementById('go').addEventListener('click', submit);
  if (plansOn && choice === 'plan') PlanPicker.mount(document.getElementById('plan-area'), o.plan, onPlanChange);
  const codeBtn = document.getElementById('code-apply');
  if (codeBtn) codeBtn.addEventListener('click', applyCode);
  const codeIn = document.getElementById('code-in');
  if (codeIn) codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyCode(); } });
  const codeToggle = document.getElementById('code-toggle');
  document.querySelectorAll('[data-fob-step]').forEach(b => b.addEventListener('click', () => fobStep(Number(b.dataset.fobStep))));
  RenewSign.mount();
  if (codeToggle) codeToggle.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('code-box').style.display = '';
    document.getElementById('code-in').focus();
  });
}

// The breakdown under the amount: the level's price, any code, their
// referral credit (H5).
function priceLinesHtml(p) {
  if (!p || !(p.discount_cents || p.credit_cents || p.fob_count)) return '';
  const row = (label, cents, green) => `<div style="display:flex;justify-content:space-between;${green ? 'color:#15803d' : ''}"><span>${label}</span><span>${cents < 0 ? '−' : ''}${money(Math.abs(cents))}</span></div>`;
  return `<div style="margin-top:14px;font-size:13.5px;line-height:1.7;border-top:1px solid var(--border);padding-top:10px">
    ${row(esc(OPTS.tier_label || 'Membership'), p.base_cents)}
    ${p.discount_cents ? row(`Code ${esc(p.code || '')}${p.code_label ? ' (' + esc(p.code_label) + ')' : ''}`, -p.discount_cents, true) : ''}
    ${p.credit_cents ? row('Your referral credit', -p.credit_cents, true) : ''}
    ${p.fob_count ? row(`${p.fob_count} extra keyfob${p.fob_count === 1 ? '' : 's'}`, p.fob_cents) : ''}
  </div>`;
}

// Extra keyfobs (PLAN.md Q): bought with the renewal, priced with the dues,
// up to the family limit counting the fobs they have.
function fobCardHtml(p) {
  const k = OPTS && OPTS.keyfobs;
  if (!k) return '';
  const btn = (d, label) => `<button type="button" data-fob-step="${d}" aria-label="${label}" style="width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font:600 18px 'Inter';cursor:pointer;color:var(--blue)">${d < 0 ? '−' : '+'}</button>`;
  return `<div class="card">
    <h2>Keyfobs</h2>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span><span class="opt-title">Extra keyfobs</span> <span style="color:var(--muted)">${money(k.fee_cents)} each</span>
        <span class="opt-sub">Up to ${k.max_per_family} per family, counting the fobs you have.${(p.fob_room ?? 0) === 0 && !p.fob_count ? ' You have the most already.' : ''}</span></span>
      <span style="display:flex;align-items:center;gap:10px;flex-shrink:0">${btn(-1, 'One fewer keyfob')}<b id="fob-qty" aria-live="polite">${p.fob_count || 0}</b>${btn(1, 'One more keyfob')}</span>
    </div>
    ${k.app_unlock ? '<div class="opt-sub" style="margin-top:8px">🔓 You can also unlock the gate from the app.</div>' : ''}
  </div>`;
}
async function fobStep(d) {
  const p = OPTS.price || {};
  const next = Math.max(0, Math.min(p.fob_room ?? 0, (p.fob_count || 0) + d));
  if (next === (p.fob_count || 0)) return;
  FOB_EXTRA = next;
  const again = await callMember('renewal_options', { discount_code: CODE, ...planParams(), fob_extra: FOB_EXTRA });
  if (again.ok) OPTS = again;
  render();
}
const fobParam = () => FOB_EXTRA === null ? {} : { fob_extra: FOB_EXTRA };
function codeHtml(p) {
  const msg = CODE && p ? (p.code_problem
    ? `<div style="color:var(--red);font-size:12.5px;margin-top:6px">${esc(p.code_problem)}</div>`
    : p.code ? `<div style="color:#15803d;font-size:12.5px;margin-top:6px">Code ${esc(p.code)} applied.</div>` : '') : '';
  return `<div style="margin-top:12px">
    <a href="#" id="code-toggle" style="font-size:13px;font-weight:600;${CODE ? 'display:none' : ''}">Have a code?</a>
    <div id="code-box" style="${CODE ? '' : 'display:none'}">
      <div style="display:flex;gap:8px;margin-top:6px">
        <input id="code-in" value="${esc(CODE)}" placeholder="Code" autocapitalize="characters" autocomplete="off" spellcheck="false" style="flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font:15px 'Inter';text-transform:uppercase">
        <button type="button" id="code-apply" style="padding:9px 15px;border:1.5px solid var(--border);border-radius:999px;background:#fff;font:600 13px 'Inter';color:var(--text);cursor:pointer">Apply</button>
      </div>
      ${msg}
    </div>
  </div>`;
}
async function applyCode() {
  CODE = document.getElementById('code-in').value.trim();
  const next = await callMember('renewal_options', { discount_code: CODE, ...planParams(), ...fobParam() });
  if (next.ok) OPTS = next;
  render();
}

function planParams() {
  return PLAN_SEL.payoff_month ? { plan_today_cents: PLAN_SEL.today_cents ?? 0, plan_payoff_month: PLAN_SEL.payoff_month } : {};
}
// The family changed "pay today" or "paid off by": the server prices it again.
async function onPlanChange(sel) {
  PLAN_SEL = sel;
  try {
    const next = await callMember('renewal_options', { discount_code: CODE, ...planParams(), ...fobParam() });
    if (next.ok) { OPTS = next; PlanPicker.update(OPTS.plan); } else PlanPicker.failed();
  } catch { PlanPicker.failed(); }
}

async function submit() {
  const btn = document.getElementById('go');
  const errEl = document.getElementById('err');
  errEl.innerHTML = '';
  // Policies and signature first (PLAN.md R6).
  const unsigned = RenewSign.problem();
  if (unsigned) { errEl.innerHTML = `<div class="err">${esc(unsigned)}</div>`; document.getElementById('renew-sign-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  btn.disabled = true;
  btn.textContent = 'Setting up…';
  try {
    const ar = document.getElementById('auto-renew');
    const started = await callMember('renew_start', { ...(ar ? { auto_renew: ar.checked } : {}), discount_code: CODE, fob_extra: (OPTS.price && OPTS.price.fob_count) || 0 });
    if (!started.ok) throw new Error(started.error || 'Could not start your renewal');
    if (!RenewSign.signed()) {
      const sg = await callMember('renew_sign', { application_id: started.application_id, ...RenewSign.payload() });
      if (!sg.ok) throw new Error(sg.error || 'Could not save your signature');
      RenewSign.markSigned(sg.signed_at);
    }

    // One tap with the saved card (PLAN.md R7).
    if (choice === 'saved' && started.amount_due_cents > 0) {
      const ap = await callMember('renew_approve', { application_id: started.application_id });
      if (!ap.ok) throw new Error(ap.error || 'Could not charge your saved card');
      window.location.href = '/m/?renewed=1';
      return;
    }
    // Covered in full by a code or their referral credit (H5).
    if (started.amount_due_cents === 0) {
      const fr = await fetch(CHECKOUT_URL, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'confirm_free', application_id: started.application_id }),
      }).then(r => r.json());
      if (!fr.ok) throw new Error(fr.error || 'Could not confirm');
      window.location.href = fr.redirect;
      return;
    }

    let planChoice = null;
    if (choice === 'plan') {
      await PlanPicker.settled();
      planChoice = PlanPicker.choice();
      if (!planChoice) throw new Error(PlanPicker.error() || 'Choose how much to pay today and when to be paid off.');
    }
    const payload = choice === 'plan'
      ? { action: 'application_plan', ...planChoice, application_id: started.application_id }
      : { action: 'application',      application_id: started.application_id };

    const res = await fetch(CHECKOUT_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const out = await res.json();
    if (!out.ok || !out.url) throw new Error(out.error || 'Could not start checkout');
    window.location.href = out.url;
  } catch (e) {
    errEl.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = choice === 'plan' ? 'Start my payment plan' : choice === 'saved' ? 'Approve and pay ' + money(OPTS.dues_cents) : 'Pay ' + money(OPTS.dues_cents);
  }
}

(async function init() {
  try {
    if (new URLSearchParams(location.search).get('cancelled')) {
      // Coming back from an abandoned checkout: the renewal row is still there
      // and renew_start is idempotent, so simply re-rendering is enough.
    }
    const me = await callMember('me');
    if (window.PoolTime) PoolTime.setZone(me && me.tenant && me.tenant.timezone);
    if (!me.ok) { logout(); return; }
    if (me.refreshed_token) { try { localStorage.setItem('poolside_member_token', me.refreshed_token); } catch (_) {} }
    document.getElementById('brand-name').textContent = me.tenant?.display_name || 'Poolside';

    OPTS = await callMember('renewal_options');
    if (!OPTS.ok) throw new Error(OPTS.error || 'Could not load renewal details');
    await RenewSign.init({ slug: me.tenant && me.tenant.slug, signerName: OPTS.signer_name, signedAt: OPTS.signed_at, canSign: OPTS.i_am_signer !== false });
    render();
  } catch (e) {
    shell(`<div class="card"><div class="err">${esc(e.message)}</div>
      <p style="margin:12px 0 0"><a href="/m/">← Back to my club</a></p></div>`);
  }
})();
</script>
</body>
