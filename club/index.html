<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading…</title>
<!-- PWA / "Add to Home Screen" wiring. /js/pwa.js sets the icon + theme
     color from branding once tenant_public lands. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" id="apple-touch-icon" href="">
<meta name="theme-color" id="meta-theme-color" content="#0a3b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="meta-apple-title" content="Poolside">
<script src="/js/pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/js/calendar.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --blue:#0a3b5c; --blue-2:#134b73; --blue-l:#e6eef5; --sun:#f59e0b;
    --bg:#fefdfb; --bg-2:#f7f3eb; --text:#0f172a; --muted:#64748b;
    --border:#e5e7eb; --green:#16a34a; --red:#dc2626;
    --shadow: 0 1px 2px rgba(10,59,92,.04), 0 8px 24px rgba(10,59,92,.06);
    --r-md: 12px; --r-lg: 18px;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.55 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: var(--blue); }
  h1 { font-family:'Fraunces', Georgia, serif; font-weight:600; letter-spacing:-.015em; margin:0; line-height: 1.05; }
  h1 { font-size: clamp(36px, 7vw, 64px); }
  h2 { font-family:'Fraunces', Georgia, serif; font-weight:600; margin:0; font-size: 22px; }

  /* Sticky top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar.translucent {
    background: rgba(10, 59, 92, .25);
    border-bottom-color: rgba(255, 255, 255, .15);
  }
  .topbar.translucent a, .topbar.translucent .name { color: #fff; }
  .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--blue); }
  .topbar a {
    font-size: 13px; font-weight: 600; text-decoration: none;
    padding: 8px 14px; border-radius: 8px;
    transition: background .12s;
  }
  .topbar a:hover { background: rgba(0,0,0,.05); }
  .topbar.translucent a:hover { background: rgba(255,255,255,.15); }

  /* Hero */
  .hero {
    flex: 1;
    position: relative;
    min-height: 78vh;
    display: flex; flex-direction: column; justify-content: center;
    color: #fff;
    padding: 100px 22px 80px;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(160deg, #0a3b5c 0%, #134b73 60%, #1e3a5f 100%);
    background-size: cover; background-position: center;
  }
  .hero-bg.with-photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,59,92,.55), rgba(10,59,92,.78));
  }
  .hero-inner {
    max-width: 720px; margin: 0 auto; text-align: center; width: 100%;
  }
  .eyebrow {
    display: inline-block; padding: 5px 14px; border-radius: 999px;
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25);
    font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    margin-bottom: 18px;
  }
  .tagline { font-size: clamp(15px, 2vw, 18px); margin-top: 18px; opacity: .92; max-width: 520px; margin-left: auto; margin-right: auto; }
  .location { margin-top: 20px; font-size: 14px; opacity: .8; }
  .actions { margin-top: 36px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 13px 26px;
    background: #fff; color: var(--blue);
    border: 0; border-radius: var(--r-md);
    font: 600 15px 'Inter', sans-serif; cursor: pointer; text-decoration: none;
    transition: transform .12s;
  }
  .btn:hover { transform: translateY(-1px); text-decoration: none; }
  .btn.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); }
  .btn.ghost:hover { background: rgba(255,255,255,.1); }

  /* Info strip */
  .strip {
    background: var(--bg-2); padding: 28px 22px;
    display: flex; gap: 32px; flex-wrap: wrap; justify-content: center;
    border-bottom: 1px solid var(--border);
  }
  /* Upcoming events */
  .events {
    max-width: 720px; margin: 0 auto; padding: 40px 22px 8px;
  }
  .events h2 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: 24px; color: var(--blue); margin: 0 0 18px;
  }
  .ev {
    display: flex; gap: 14px; align-items: flex-start;
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--r-md); padding: 14px 18px;
    margin-bottom: 8px; box-shadow: var(--shadow);
  }
  .ev-date {
    flex-shrink: 0; width: 56px; text-align: center;
    background: var(--bg-2); border-radius: 8px; padding: 8px 0;
  }
  .ev-date .mo { font-size: 11px; color: var(--blue); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .ev-date .da { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--blue); line-height: 1.1; }
  .ev-body { flex: 1; min-width: 0; }
  .ev-title { font-weight: 600; font-size: 15px; }
  .ev-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ev-loc  { font-size: 12px; color: var(--blue); margin-top: 2px; }

  /* Photo gallery */
  .gallery { max-width: 1100px; margin: 0 auto; padding: 40px 22px 8px; }
  .gallery h2 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: 24px; color: var(--blue); margin: 0 0 18px;
  }
  .ggrid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .ggrid .gtile {
    aspect-ratio: 1; overflow: hidden; border-radius: var(--r-md);
    background: var(--bg-2); border: 1px solid var(--border); cursor: pointer;
  }
  .ggrid .gtile img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .ggrid .gtile:hover img { transform: scale(1.05); }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.92);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 22px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 90vh; object-fit: contain; }
  .lightbox .close, .lightbox .nav {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,.15); color: #fff; border: 0;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
  }
  .lightbox .nav { top: 50%; transform: translateY(-50%); }
  .lightbox .nav.prev { left: 16px; right: auto; }
  .lightbox .nav.next { right: 16px; }
  .lightbox .cap {
    position: absolute; bottom: 22px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 14px; padding: 0 22px;
  }

  /* Posts */
  .news {
    max-width: 720px; margin: 0 auto; padding: 48px 22px;
  }
  .news h2 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: 24px; color: var(--blue); margin: 0 0 22px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .news h2 .count { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; color: var(--muted); }
  .post {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 22px 24px; margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .post.pinned { border-left: 4px solid var(--sun); }
  .post-title { font-family:'Fraunces', Georgia, serif; font-weight: 600; font-size: 20px; color: var(--blue); margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .post-meta { font-size: 12px; color: var(--muted); margin: 4px 0 12px; }
  .post-body { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .pin-pill { background:#fef3c7; color:#92400e; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; }
  .stat {
    text-align: center; min-width: 140px;
  }
  .stat .lbl {
    font-size: 11px; color: var(--muted);
    font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 4px;
  }
  .stat .val { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--blue); }

  /* Pill */
  .pill {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  }
  .pill.trial    { background: #fef3c7; color: #92400e; }
  .pill.active   { background: rgba(255,255,255,.2); color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .pill.suspended{ background: #fee2e2; color: #7f1d1d; }
  .pill.churned  { background: #f3f4f6; color: #4b5563; }
  .pill.float    { position: absolute; top: 18px; right: 22px; }

  footer { padding: 22px; text-align: center; font-size: 12px; color: var(--muted); }
  .err {
    max-width: 480px; margin: 60px auto; padding: 28px 22px;
    text-align: center; background: #fff; border: 1px solid var(--border);
    border-radius: var(--r-lg); box-shadow: var(--shadow);
  }

  @media (max-width: 600px) {
    .topbar a { padding: 6px 10px; font-size: 12px; }
    .hero { padding: 80px 16px 60px; min-height: 70vh; }
    .strip { gap: 18px; padding: 22px 16px; }
  }
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <span class="name" id="club-name">Loading…</span>
  <a id="admin-link" href="/club/admin/login.html">Admin sign in</a>
</div>

<div id="root"></div>

<script src="/js/calendar.js"></script>

<div class="lightbox" id="lightbox" onclick="if (event.target === this) closeLightbox()">
  <button class="close" onclick="closeLightbox()" aria-label="Close">×</button>
  <button class="nav prev" onclick="lbStep(-1)" aria-label="Previous">‹</button>
  <button class="nav next" onclick="lbStep(+1)" aria-label="Next">›</button>
  <img id="lb-img" alt="">
  <div class="cap" id="lb-cap"></div>
</div>

<!-- Donate modal — opened from the fundraiser card on the public landing.
     Uses the tenant's Venmo handle + custom donate message. -->
<div id="donate-scrim" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);align-items:center;justify-content:center;padding:20px;z-index:220" onclick="if (event.target === this) closeDonate()">
  <div style="background:#fff;border-radius:18px;max-width:420px;width:100%;padding:26px;text-align:center;box-shadow:0 30px 60px -10px rgba(15,23,42,.35)">
    <h2 id="d-title" style="margin:0 0 8px;font-family:'Fraunces',Georgia,serif;color:var(--blue);font-size:22px">Donate</h2>
    <p id="d-msg" style="font-size:13.5px;color:var(--muted);margin:6px 0 14px;line-height:1.55;white-space:pre-wrap"></p>
    <canvas id="d-qr" style="width:240px;height:240px;border-radius:14px;border:2px solid var(--border);background:#fff;padding:6px;margin:0 auto;display:block"></canvas>
    <div id="d-handle" style="margin-top:10px;font-size:15px;font-weight:700;color:var(--blue)"></div>
    <button class="btn" onclick="closeDonate()" style="margin-top:14px;background:transparent;color:var(--blue);border:1.5px solid var(--border);padding:8px 18px;border-radius:10px;cursor:pointer;font:600 13px Inter">Close</button>
  </div>
</div>

<!-- Anonymous feedback modal — public visitors and members both. -->
<div id="feedback-scrim" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);align-items:flex-start;justify-content:center;overflow-y:auto;padding:32px 16px;z-index:220" onclick="if (event.target === this) closeFeedback()">
  <div style="background:#fff;border-radius:18px;max-width:520px;width:100%;padding:26px;box-shadow:0 30px 60px -10px rgba(15,23,42,.35)">
    <h2 style="margin:0;font-family:'Fraunces',Georgia,serif;color:var(--blue);font-size:22px">💬 Anonymous feedback</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:6px 0 14px;line-height:1.55">Tell the board about a pool issue or share a comment. We don't track who sent it.</p>
    <label style="display:block;font:600 11px Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px">Add a photo (optional)</label>
    <input type="file" id="fb-photo" accept="image/jpeg,image/png,image/webp,image/gif">
    <img id="fb-photo-preview" src="" style="display:none;margin-top:8px;max-width:100%;border-radius:10px;border:1px solid var(--border)">
    <label style="display:block;font:600 11px Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px">Your comment *</label>
    <textarea id="fb-comment" rows="5" maxlength="2000" placeholder="What happened, what should the board know?" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font:14px/1.5 Inter;resize:vertical"></textarea>
    <p style="font-size:11px;color:var(--muted);margin:6px 0 0">🔒 Anonymous — your name and email are not collected.</p>
    <div id="fb-err" style="display:none;margin-top:10px;padding:10px 12px;font-size:13px;background:#fee2e2;border:1px solid #fecaca;color:#7f1d1d;border-radius:10px"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
      <button onclick="closeFeedback()" style="background:transparent;color:var(--blue);border:1.5px solid var(--border);padding:9px 18px;border-radius:10px;cursor:pointer;font:600 13px Inter">Cancel</button>
      <button id="fb-submit" onclick="submitFeedback()" style="background:var(--blue);color:#fff;border:0;padding:10px 20px;border-radius:10px;cursor:pointer;font:600 13px Inter">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="/js/sponsor-popup.js" defer></script>

<footer>Powered by <a href="https://poolsideapp.com">Poolside</a></footer>

<script>
const SUPABASE_URL = 'https://sdewylbddkcvidwosgxo.supabase.co';
const PUBLIC_LOOKUP = `${SUPABASE_URL}/functions/v1/tenant_public`;

// ── Donate modal (Venmo QR) ───────────────────────────────────────────
function openDonate() {
  const ps = window.PUBLIC_DATA && window.PUBLIC_DATA.public_settings || {};
  const fund = ps.fundraiser || {};
  const handle = ps.payments && ps.payments.venmo_handle;
  document.getElementById('d-title').textContent = fund.title || 'Donate';
  document.getElementById('d-msg').textContent = fund.donate_message
    || `Thank you for supporting ${(window.PUBLIC_DATA && window.PUBLIC_DATA.tenant && window.PUBLIC_DATA.tenant.display_name) || 'the club'}!`;
  document.getElementById('d-handle').textContent = handle ? '@' + handle : '';
  if (handle && typeof qrcode !== 'undefined') {
    const url = `https://venmo.com/${encodeURIComponent(handle)}`;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const canvas = document.getElementById('d-qr');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.height = 240;
    const cells = qr.getModuleCount(); const size = 240 / cells;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 240, 240);
    ctx.fillStyle = '#0a3b5c';
    for (let r = 0; r < cells; r++) for (let c = 0; c < cells; c++) {
      if (qr.isDark(r, c)) ctx.fillRect(c * size, r * size, size, size);
    }
  }
  document.getElementById('donate-scrim').style.display = 'flex';
}
function closeDonate() { document.getElementById('donate-scrim').style.display = 'none'; }

// ── Anonymous feedback modal ──────────────────────────────────────────
function openFeedback() {
  document.getElementById('fb-comment').value = '';
  document.getElementById('fb-photo').value = '';
  document.getElementById('fb-photo-preview').style.display = 'none';
  document.getElementById('fb-err').style.display = 'none';
  document.getElementById('feedback-scrim').style.display = 'flex';
}
function closeFeedback() { document.getElementById('feedback-scrim').style.display = 'none'; }
document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'fb-photo') {
    const file = e.target.files && e.target.files[0];
    const img = document.getElementById('fb-photo-preview');
    if (file) {
      const r = new FileReader();
      r.onload = () => { img.src = r.result; img.style.display = 'block'; };
      r.readAsDataURL(file);
    } else { img.style.display = 'none'; }
  }
});
async function submitFeedback() {
  const errEl = document.getElementById('fb-err'); errEl.style.display = 'none';
  const comment = document.getElementById('fb-comment').value.trim();
  if (!comment) { errEl.textContent = 'Please add a comment.'; errEl.style.display = 'block'; return; }
  const slug = (() => {
    const m = window.location.hostname.match(/^([a-z0-9][a-z0-9-]*)\.poolsideapp\.com$/i);
    return m && m[1] && m[1] !== 'www' ? m[1].toLowerCase() : null;
  })();
  if (!slug) { errEl.textContent = 'Cannot submit from this URL.'; errEl.style.display = 'block'; return; }
  const file = document.getElementById('fb-photo').files[0] || null;
  let photo_content_type = null; let photo_base64 = null;
  if (file) {
    if (file.size > 8 * 1024 * 1024) { errEl.textContent = 'Photo too large (max 8 MB).'; errEl.style.display = 'block'; return; }
    photo_content_type = file.type;
    photo_base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1] || '');
      r.onerror = () => rej(new Error('Could not read photo'));
      r.readAsDataURL(file);
    });
  }
  const btn = document.getElementById('fb-submit'); btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Sending…';
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/feedback`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'submit', slug, comment, photo_content_type, photo_base64 }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Submit failed');
    closeFeedback();
    alert('✓ Thanks — your feedback is on the way to the board.');
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return String(s ?? '').replace(/["']/g, c => ({'"':'&quot;',"'":'&#39;'}[c]));
}

function getSlugFromHostname() {
  const host = window.location.hostname;
  const m = host.match(/^([a-z0-9][a-z0-9-]*)\.poolsideapp\.com$/i);
  if (!m) return null;
  if (['www','admin','api','app'].includes(m[1].toLowerCase())) return null;
  return m[1].toLowerCase();
}

function fmtTime12(hhmm) {
  if (!hhmm) return null;
  const m = String(hhmm).match(/^(\d{1,2}):(\d{2})/);
  if (!m) return hhmm;
  let h = parseInt(m[1], 10);
  const mm = m[2];
  const ampm = h < 12 ? 'AM' : 'PM';
  if (h === 0) h = 12;
  else if (h > 12) h -= 12;
  return mm === '00' ? `${h} ${ampm}` : `${h}:${mm} ${ampm}`;
}

function renderNotFound(slug) {
  document.title = 'Club not found — Poolside';
  document.getElementById('club-name').textContent = 'Poolside';
  document.getElementById('root').innerHTML = `
    <div class="err">
      <h1 style="font-size:28px;margin-bottom:8px">Club not found</h1>
      <p style="color:var(--muted)">There's no Poolside club at <b>${escapeHtml(slug ?? window.location.hostname)}</b>.</p>
      <p style="margin-top:18px"><a href="https://poolsideapp.com/signup.html" style="font-weight:600">Start your own club →</a></p>
    </div>
  `;
}

function fmtPostDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

const KIND_ICON = {
  event: '📅', party: '🎉', swim_meet: '🏊‍♀️', social: '🥳',
  closure: '🚫', holiday: '🎆', lesson: '🏫', meeting: '📋',
};
const KIND_LABEL = {
  event: 'Event', party: 'Party', swim_meet: 'Swim meet', social: 'Social',
  closure: 'Closure', holiday: 'Holiday', lesson: 'Lesson', meeting: 'Meeting',
};
function fmtEventTime(ev) {
  const start = new Date(ev.starts_at);
  if (ev.all_day) return 'All day';
  const opts = { hour: 'numeric', minute: '2-digit' };
  if (!ev.ends_at) return start.toLocaleTimeString(undefined, opts);
  const end = new Date(ev.ends_at);
  if (start.toDateString() === end.toDateString()) {
    return `${start.toLocaleTimeString(undefined, opts)} – ${end.toLocaleTimeString(undefined, opts)}`;
  }
  return `${start.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })} → ${end.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}`;
}
function eventDateBadge(ev) {
  const d = new Date(ev.starts_at);
  const mo = d.toLocaleDateString(undefined, { month: 'short' });
  const da = d.getDate();
  return `<div class="ev-date"><div class="mo">${escapeHtml(mo)}</div><div class="da">${da}</div></div>`;
}

let GALLERY = [];

function openLightbox(idx) {
  const lb = document.getElementById('lightbox');
  if (!lb) return;
  lb.dataset.idx = String(idx);
  const p = GALLERY[idx];
  if (!p) return;
  document.getElementById('lb-img').src = p.url;
  document.getElementById('lb-cap').textContent = p.caption || '';
  lb.classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox')?.classList.remove('open'); }
function lbStep(delta) {
  const lb = document.getElementById('lightbox');
  if (!lb) return;
  const cur = parseInt(lb.dataset.idx || '0', 10);
  const next = (cur + delta + GALLERY.length) % GALLERY.length;
  openLightbox(next);
}

document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox');
  if (!lb || !lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lbStep(-1);
  else if (e.key === 'ArrowRight') lbStep(+1);
});

function fmtHourLabel(hhmm) {
  if (!hhmm) return null;
  const m = String(hhmm).split(':');
  let h = parseInt(m[0], 10);
  if (!Number.isFinite(h)) return null;
  const ap = h < 12 ? 'A' : 'P';
  if (h === 0) h = 12; else if (h > 12) h -= 12;
  return m[1] === '00' ? `${h}${ap}` : `${h}:${m[1]}${ap}`;
}

  // Snapshots auto-scroll carousel — fades between slides every 5 seconds,

    const slides = carousel.querySelectorAll('.cslide');
    const dots   = carousel.querySelectorAll('.cdot');
    const prev   = carousel.querySelector('.cprev');
    const next   = carousel.querySelector('.cnext');
    let idx = 0;
    let timer = null;
    function go(n) {
      idx = (n + slides.length) % slides.length;
      slides.forEach((s, i) => { s.style.opacity = i === idx ? '1' : '0'; });
      dots.forEach((d, i) => { d.style.background = i === idx ? '#fff' : 'rgba(255,255,255,.45)'; });
    }
    function start() {
      stop();
      if (slides.length > 1) timer = setInterval(() => go(idx + 1), 5000);
    }
    function stop() { if (timer) clearInterval(timer); timer = null; }

    carousel.addEventListener('click', (e) => {
      if (e.target.closest('.cnav') || e.target.closest('.cdot')) return;
      openLightbox(idx);
    });
    if (prev) prev.addEventListener('click', (e) => { e.stopPropagation(); go(idx - 1); start(); });
    if (next) next.addEventListener('click', (e) => { e.stopPropagation(); go(idx + 1); start(); });
    dots.forEach(d => d.addEventListener('click', (e) => { e.stopPropagation(); go(Number(d.dataset.i)); start(); }));

    // Touch swipe — horizontal drag > 40px advances/rewinds.
    let touchStartX = null, touchStartY = null;
    carousel.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    }, { passive: true });
    carousel.addEventListener('touchend', (e) => {
      if (touchStartX == null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        go(dx > 0 ? idx - 1 : idx + 1); start();
      }
      touchStartX = touchStartY = null;
    }, { passive: true });

    if (slides.length > 1) {
      carousel.addEventListener('mouseenter', stop);
      carousel.addEventListener('mouseleave', start);
    }
    start();
  }
  // Touch swipe on the lightbox itself once it's open — drag through
  // photos in the fullscreen view.
  (function attachLightboxSwipe() {
    const lb = document.getElementById('lightbox');
    if (!lb || lb.dataset.swipeWired) return;
    lb.dataset.swipeWired = '1';
    let sx = null, sy = null;
    lb.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    lb.addEventListener('touchend', (e) => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) lbStep(dx > 0 ? -1 : +1);
      sx = sy = null;
    }, { passive: true });
  })();
}

    const res = await fetch(PUBLIC_LOOKUP, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ slug }),
    });
    if (res.status === 404) { renderNotFound(slug); return; }
    const data = await res.json();
    if (!data.ok || !data.tenant) { renderNotFound(slug); return; }
    renderTenant(data.tenant, data.public_settings || {}, data.posts || [], data.events || [], data.photos || [], data.documents || [], data.programs || [], data.sponsors || [], data.member_count || null);

    // Sponsor popup — rotates through active sponsors per the tenant's
    // configured frequency (every load / once per session / once per day).
    if (window.SponsorPopup) {
      window.SponsorPopup.maybeShow({
        sponsors: data.sponsors || [],
        config:   (data.public_settings && data.public_settings.sponsors_config) || {},
      });
    }
  } catch (e) {
    document.getElementById('root').innerHTML = `
      <div class="err">
        <h1 style="font-size:28px;margin-bottom:8px">Couldn't reach Poolside</h1>
        <p style="color:var(--red)">${escapeHtml(e.message || 'Network error')}</p>
        <p style="margin-top:18px"><a href="">Try again</a></p>
      </div>
    `;
  }
})();
</script>
</body>
</html>
