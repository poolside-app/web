<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Membership levels — Poolside</title>
<script src="/js/errors.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#0a3b5c; --blue-2:#134b73; --blue-l:#e6eef5; --sun:#f59e0b;
    --bg:#fefdfb; --bg-2:#f7f3eb; --text:#0f172a; --muted:#5d6b81;
    --border:#e5e7eb; --green:#16a34a; --red:#dc2626;
    --shadow: 0 1px 2px rgba(10,59,92,.04), 0 8px 24px rgba(10,59,92,.06);
    --r-md: 12px; --r-lg: 18px;
  }
  *,*::before,*::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: var(--blue); }
  h1, h2, h3 { font-family:'Fraunces', Georgia, serif; font-weight:600; letter-spacing:-.015em; margin:0; }
  h1 { font-size: 26px; } h2 { font-size: 18px; margin-bottom: 12px; } h3 { font-size: 15px; margin: 0 0 8px; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; color: var(--blue); text-decoration: none; }
  .logo-dot { width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--sun),#fbbf24); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  header { padding: 14px 22px; border-bottom: 1px solid var(--border); background:#fff; display: flex; justify-content: space-between; align-items: center; }
  .who { font-size: 13px; color: var(--muted); display: flex; gap: 14px; align-items: center; }
  .who a { cursor: pointer; }
  nav.tabs { background: #fff; border-bottom: 1px solid var(--border); padding: 0 22px; display: flex; gap: 4px; overflow-x: auto; }
  nav.tabs a { padding: 12px 14px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; text-decoration: none; margin-bottom: -1px; white-space: nowrap; }
  nav.tabs a.on { color: var(--blue); border-bottom-color: var(--blue); }
  nav.tabs a:hover { color: var(--blue); }
  main { flex: 1; padding: 28px 22px; max-width: 880px; width: 100%; margin: 0 auto; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .btn { padding: 10px 18px; border-radius: var(--r-md); font: 600 13px 'Inter'; cursor: pointer; border: 1.5px solid transparent; background: var(--blue); color: #fff; }
  .btn:hover { background: var(--blue-2); }
  .btn-ghost { background: transparent; color: var(--blue); border-color: var(--border); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .pol { background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 22px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .pol h3 { font-size: 16px; margin: 0; }
  .pol .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pol .body { font-size: 13px; color: var(--text); margin-top: 10px; line-height: 1.5; white-space: pre-wrap; max-height: 80px; overflow: hidden; position: relative; }
  .pol .body::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 24px; background: linear-gradient(transparent, #fff); }
  .pol.expanded .body { max-height: none; }
  .pol.expanded .body::after { display: none; }
  .pol-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .pol .actions { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .reorder { display: flex; gap: 4px; }
  .reorder button { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; font-weight: 700; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .pill.req  { background: #fef3c7; color: #92400e; }
  .pill.info { background: #e0e7ff; color: #3730a3; }
  .pill.off  { background: #f3f4f6; color: #4b5563; }
  .empty { padding: 60px 22px; text-align: center; color: var(--muted); border: 2px dashed var(--border); border-radius: var(--r-md); }
  .scrim { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 32px 16px; z-index: 50; }
  .scrim.open { display: flex; }
  .modal { background: #fff; border-radius: var(--r-lg); padding: 26px; width: 100%; max-width: 640px; box-shadow: 0 20px 60px rgba(10,59,92,.18); }
  .modal label { display: block; font-weight: 600; font-size: 12px; margin: 12px 0 4px; }
  .modal input, .modal textarea { width: 100%; padding: 10px 12px; font: 14px/1.55 'Inter'; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; font-family: inherit; }
  .modal textarea { resize: vertical; min-height: 220px; line-height: 1.55; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .modal-foot .left { margin-right: auto; }
  .err { display:none; margin-top:12px; padding:10px 14px; font-size:13px; background:#fee2e2; border:1px solid #fecaca; color:#7f1d1d; border-radius:10px; }
  .err.show { display: block; }
  footer { padding: 20px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <a href="/" class="logo"><span class="logo-dot"></span> Poolside</a>
  <div class="who"><span id="whoami">…</span><a id="signout">Sign out</a></div>
</header>
<nav class="tabs">
  <a href="/club/admin/">Dashboard</a>
  <a href="/club/admin/members.html">Members</a>
  <a href="/club/admin/payments.html" class="on">Money</a>
  <a href="/club/admin/events.html">Calendar</a>
  <a href="/club/admin/announcements.html">Content</a>
  <a href="/club/admin/impact.html">Insights</a>
  <a href="/club/admin/settings.html">Settings</a>
</nav>
<div id="admin-subtabs"></div>
<script src="/js/admin-subtabs.js"></script>
<script src="/js/admin-flags.js"></script>
<script src="/js/focus-highlight.js"></script>
<script src="/js/admin-help-fab.js" defer></script>

<main>
  <div class="toolbar" data-focus="tiers">
    <div>
      <h1>Membership levels</h1>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">The levels applicants pick from on the apply form. The first one is the default. Leave the price blank if you bill per-household manually.</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost" type="button" onclick="Tiers.add()">+ Add level</button>
      <button class="btn" id="tiers-save" type="button" onclick="Tiers.save()">Save levels</button>
    </div>
  </div>
  <div class="card" style="padding:18px">
    <div id="tiers-list"><div class="empty" style="padding:30px">Loading…</div></div>
  </div>
  <div class="err" id="tiers-err" style="margin-top:14px"></div>
</main>

<footer>Powered by <a href="https://poolsideapp.com">Poolside</a></footer>

<script>
const SUPABASE_URL = 'https://sdewylbddkcvidwosgxo.supabase.co';
const SETTINGS_URL = `${SUPABASE_URL}/functions/v1/tenant_settings`;

function token() { return localStorage.getItem('poolside_tenant_token'); }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function logout() {
  // Self-healing: don't nuke a valid session on transient errors. Validate
  // the token first; only really log out if it's confirmed bad. Random
  // logouts Doug hit 2026-05-20 came from catch blocks calling logout()
  // on network blips / parse errors / non-200s where the token was fine.
  try {
    const t = localStorage.getItem('poolside_tenant_token');
    if (t) {
      const vr = await fetch('https://sdewylbddkcvidwosgxo.supabase.co/functions/v1/tenant_admin_auth', {
        method: 'POST', headers: { 'content-type': 'application/json', 'authorization': `Bearer ${t}` },
        body: JSON.stringify({ action: 'me' }),
      });
      if (vr.status !== 401) return;  // token still good - caller had a transient bug
    }
  } catch (_) { return; }  // network blip during validation - assume token is fine
  ['poolside_tenant_token','poolside_tenant_user','poolside_tenant_tenant'].forEach(k => localStorage.removeItem(k));
  window.location.href = '/club/admin/login.html';
}
document.getElementById('signout').addEventListener('click', logout);

async function call(url, action, extra = {}) {
  const t = token();
  if (!t) { logout(); throw new Error('Not signed in'); }
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'authorization': `Bearer ${t}` },
    body: JSON.stringify({ action, ...extra }),
  });
  if (res.status === 401) { logout(); throw new Error('Session expired'); }
  return res.json();
}

// ── Tiers namespace ────────────────────────────────────────────────────
// Moved out of members.html on 2026-09-07. Tiers were a hash-addressed
// panel there (#tiers) with no sub-tab pointing at them, so the only way
// to reach this screen was to already know the URL. Prices belong with
// the rest of the money surfaces, so it now lives under Money.
//
// Save sends only `{ membership_tiers: [...] }` — tenant_settings.save
// shallow-merges, so every other settings key survives.
const Tiers = (() => {
  const TIER_DEFAULTS = [
    { slug: 'family', label: 'Family',  price_cents: 60000, description: 'All household members' },
    { slug: 'single', label: 'Single',  price_cents: 35000, description: 'One adult' },
    { slug: 'senior', label: 'Senior',  price_cents: 25000, description: '65+' },
  ];
  let LOADED = false;

  function paint(tiers) {
    const list = document.getElementById('tiers-list');
    if (!list) return;
    const rows = (tiers && tiers.length) ? tiers : TIER_DEFAULTS;
    list.innerHTML = rows.map((t, i) => `
      <div class="tier-row" style="display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin-bottom:12px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--border)" data-i="${i}">
        <div><label style="font-size:11px;font-weight:600;margin:0 0 4px;display:block">Name shown to applicants</label><input data-field="label" value="${escapeHtml(t.label || '')}" placeholder="Family" style="width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font:14px 'Inter'"></div>
        <div><label style="font-size:11px;font-weight:600;margin:0 0 4px;display:block">Annual price ($)</label><input data-field="price" type="number" min="0" step="0.01" value="${typeof t.price_cents === 'number' ? (t.price_cents / 100).toFixed(2) : ''}" style="width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font:14px 'Inter'"></div>
        <button type="button" onclick="this.parentElement.remove()" title="Remove tier" style="padding:9px 12px;background:transparent;color:var(--red);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px">×</button>
        <div style="grid-column:1/-1"><label style="font-size:11px;font-weight:600;margin:0 0 4px;display:block">Description (optional)</label><input data-field="description" value="${escapeHtml(t.description || '')}" placeholder="What this tier covers" style="width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font:14px 'Inter'"></div>
        <input type="hidden" data-field="slug" value="${escapeHtml(t.slug || '')}">
      </div>
    `).join('');
  }
  function collect() {
    const out = [];
    document.querySelectorAll('#tiers-list .tier-row').forEach(row => {
      const get = (f) => (row.querySelector(`[data-field="${f}"]`) || {}).value || '';
      const label = get('label').trim();
      if (!label) return;
      const slug = (get('slug').trim() || label).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      const price = parseFloat(get('price'));
      const desc = get('description').trim();
      out.push({
        slug, label,
        price_cents: Number.isFinite(price) ? Math.round(price * 100) : 0,
        description: desc || null,
      });
    });
    return out;
  }
  function add() {
    const tiers = collect();
    tiers.push({ slug: '', label: '', price_cents: 0, description: '' });
    paint(tiers);
  }
  async function refresh() {
    const errEl = document.getElementById('tiers-err');
    errEl.classList.remove('show');
    try {
      const data = await call(SETTINGS_URL, 'get');
      if (!data.ok) throw new Error(data.error || 'Failed to load');
      const tiers = Array.isArray(data.settings?.membership_tiers) ? data.settings.membership_tiers : null;
      paint(tiers);
      LOADED = true;
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.add('show');
    }
  }
  async function save() {
    const btn = document.getElementById('tiers-save');
    const errEl = document.getElementById('tiers-err');
    errEl.classList.remove('show');
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = 'Saving…';
    try {
      const tiers = collect();
      const data = await call(SETTINGS_URL, 'save', { value: { membership_tiers: tiers } });
      if (!data.ok) throw new Error(data.error || 'Save failed');
      btn.textContent = '✓ Saved';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = orig;
    }
  }
  return { refresh, paint, add, save };
})();

(async () => {
  try {
    const me = await call(`${SUPABASE_URL}/functions/v1/tenant_admin_auth`, 'me');
    if (!me.ok) { logout(); return; }
    document.getElementById('whoami').textContent = me.user?.display_name || me.user?.username || '';
  } catch (_) { /* header name is cosmetic; don't block the page */ }
  Tiers.refresh();
})();
</script>
</body>
</html>
