<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/js/phone-fit.js"></script>
<!-- Board manifest: name "… — Board", start_url /club/admin/. Without
     this the dashboard could not be installed at all, and iOS made a
     plain bookmark with no icon. -->
<link rel="manifest" href="/manifest.webmanifest?admin=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Board">
<title>Admin — Poolside</title>
<script src="/js/pooltime.js"></script>
<script src="/js/errors.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#0a3b5c; --blue-2:#134b73; --blue-l:#e6eef5; --sun:#f59e0b;
    --bg:#fefdfb; --bg-2:#f7f3eb; --text:#0f172a; --muted:#5d6b81;
    --border:#e5e7eb; --green:#16a34a; --red:#dc2626;
    --shadow: 0 1px 2px rgba(10,59,92,.04), 0 8px 24px rgba(10,59,92,.06);
    --r-md: 12px; --r-lg: 18px;
  }
  *,*::before,*::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: var(--blue); }
  h1, h2, h3 { font-family:'Fraunces', Georgia, serif; font-weight:600; letter-spacing:-.015em; margin:0; }
  h1 { font-size: 32px; line-height: 1.1; }
  h2 { font-size: 18px; margin-bottom: 12px; }
  .logo {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px;
    color: var(--blue); text-decoration: none;
  }
  .logo-dot { width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--sun),#fbbf24); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--border); background:#fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .who { font-size: 13px; color: var(--muted); display: flex; gap: 14px; align-items: center; }
  .who a { color: var(--blue); cursor: pointer; }
  main {
    flex: 1; padding: 26px 22px 32px;
    max-width: 1080px; width: 100%; margin: 0 auto;
  }
  .card {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 20px 22px;
    box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .placeholder {
    border: 2px dashed var(--border); border-radius: var(--r-md);
    padding: 26px 18px; text-align: center; color: var(--muted); font-size: 14px;
  }
  /* nav.tabs: horizontal scroll the tab strip itself on narrow viewports
     instead of pushing the whole page wider (mobile fix 2026-05-22). */
  nav.tabs {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 22px; display: flex; gap: 4px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a {
    padding: 12px 14px; font-size: 13px; font-weight: 600; color: var(--muted);
    border-bottom: 3px solid transparent; text-decoration: none; margin-bottom: -1px;
    white-space: nowrap; flex-shrink: 0;
  }
  nav.tabs a.on { color: var(--blue); border-bottom-color: var(--blue); }
  nav.tabs a:hover { color: var(--blue); }
  footer { padding: 20px; text-align: center; font-size: 12px; color: var(--muted); }

  /* ── The board home (PLAN.md W): the member home's layout, one per board
     member. Banner, the gate, Needs you, today, quick buttons. ── */
  .hero { background: linear-gradient(135deg, var(--blue), var(--blue-2)); color: #fff; border-radius: var(--r-lg); padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 10px 30px rgba(10,59,92,.18); }
  .hero-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .hero h1 { font-size: 22px; color: #fff; }
  .hero-date { font-size: 13px; opacity: .85; white-space: nowrap; }
  .hero-badges { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .hb { padding: 3px 10px; border-radius: 999px; font: 700 12.5px 'Inter', sans-serif; }
  .hb.role { background: rgba(255,255,255,.14); color: #fff; }
  .hb.season { background: rgba(34,197,94,.22); color: #dcfce7; }
  .hero-line { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 13.5px; }
  .hero-line span { white-space: nowrap; }
  .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; border-top: 1px solid rgba(255,255,255,.16); padding-top: 12px; }
  .hs { padding: 0 8px; border-left: 1px solid rgba(255,255,255,.16); color: #fff; text-decoration: none; min-width: 0; }
  .hs:first-child { border-left: 0; padding-left: 0; }
  .hs .v { font: 700 19px 'Inter', sans-serif; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hs .l { font-size: 11.5px; opacity: .8; margin-top: 1px; line-height: 1.3; }

  .gate { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px !important; }
  .gate .gi { font-size: 22px; }
  .gate .gt { flex: 1; font-weight: 600; font-size: 15px; min-width: 0; }
  .gate .gt small { display: block; font-weight: 500; font-size: 12.5px; color: var(--green); }
  .gate .gt small.off { color: var(--muted); }
  .hbtn { padding: 9px 16px; border-radius: 10px; font: 600 13.5px 'Inter', sans-serif; border: 0; background: var(--blue); color: #fff; white-space: nowrap; text-decoration: none; cursor: pointer; display: inline-block; }
  .hbtn.ghost { background: var(--blue-l); color: var(--blue); }
  .hbtn:disabled { opacity: .6; cursor: default; }

  .card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .card-h h2 { margin: 0; }
  .count { background: var(--sun); color: var(--blue); font: 700 12px/20px 'Inter', sans-serif; padding: 0 8px; border-radius: 999px; }
  .sub-h { font: 700 11.5px 'Inter', sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; }
  .todo { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); }
  .todo:first-child { border-top: 0; padding-top: 2px; }
  .ti { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--blue-l); }
  .ti.money { background: #dcfce7; } .ti.fob { background: #fef3c7; } .ti.ask { background: #ede9fe; } .ti.party { background: #fce7f3; }
  .tt { flex: 1; min-width: 0; }
  .tt b { display: block; font-size: 14.5px; font-weight: 600; }
  .tt span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 1px; overflow-wrap: anywhere; }
  .tt .meta { font-size: 11.5px; margin-top: 3px; }
  .tt .meta button { background: none; border: 0; padding: 0; color: var(--blue); font: 600 11.5px 'Inter', sans-serif; cursor: pointer; }
  .ev { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); align-items: center; }
  .ev:first-child, .sub-h + .ev { border-top: 0; }
  .ev .when { width: 92px; flex: none; font: 600 12.5px 'Inter', sans-serif; color: var(--blue); }
  .ev .what { flex: 1; font-size: 14px; min-width: 0; }
  .ev .what small { display: block; font-size: 12px; color: var(--muted); }
  .tag { font: 600 11px 'Inter', sans-serif; padding: 2px 8px; border-radius: 999px; background: var(--bg-2); color: var(--muted); white-space: nowrap; text-decoration: none; }
  .tag.wait { background: #fef3c7; color: #92400e; }
  .qa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qa a { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--bg-2); color: var(--text); text-decoration: none; font: 600 13.5px 'Inter', sans-serif; min-width: 0; }
  .qa a span { font-size: 20px; }
  .rows > a, .rows > details > summary, .rows > .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; list-style: none; }
  .rows > :first-child, .rows > details:first-child > summary { border-top: 0; padding-top: 0; }
  .rows > details > summary::-webkit-details-marker { display: none; }
  .rows .arr { margin-left: auto; color: var(--muted); }
  .rows .copy { margin-left: auto; font: 600 12.5px 'Inter', sans-serif; color: var(--blue); background: var(--blue-l); padding: 5px 10px; border-radius: 8px; border: 0; cursor: pointer; }
  .job { font-size: 13.5px; line-height: 1.6; padding: 0 0 10px; }
  .layout { display: block; }
  @media (min-width: 900px) {
    .hero { display: grid; grid-template-columns: 1fr 1.1fr; align-items: center; gap: 24px; padding: 22px 26px; margin-bottom: 18px; }
    .hero h1 { font-size: 26px; }
    .hero-top { justify-content: flex-start; gap: 14px; }
    .hero-stats { margin: 0; border-top: 0; padding-top: 0; }
    .hs { padding: 4px 18px; }
    .hs .v { font-size: 24px; }
    .layout { display: flex; align-items: flex-start; gap: 18px; }
    .col.left { flex: 1.55; min-width: 0; }
    .col.right { flex: 1; min-width: 0; }
  }
</style>
</head>
<body>
<header>
  <a href="/" class="logo"><span class="logo-dot"></span> Poolside</a>
  <div class="who">
    <span id="whoami">…</span>
    <!-- Shown when this admin is also a member (linked_member_id set). -->
    <a id="member-switch" href="/m/" style="display:none">Member view &rarr;</a>
    <a id="signout">Sign out</a>
  </div>
</header>
<nav class="tabs">
  <a href="/club/admin/" class="on">Dashboard</a>
  <a href="/club/admin/members.html">Members</a>
  <a href="/club/admin/payments.html">Money</a>
  <a href="/club/admin/events.html">Calendar</a>
  <a href="/club/admin/announcements.html">Content</a>
  <a href="/club/admin/audit.html">Insights</a>
  <a href="/club/admin/settings.html">Settings</a>
</nav>
<div id="admin-subtabs"></div>
<script src="/js/admin-subtabs.js"></script>
<script src="/js/admin-flags.js"></script>
<script src="/js/admin-help-fab.js" defer></script>
<script src="/js/admin-push.js" defer></script>
<script src="/js/upcoming.js"></script>
<script src="/js/today.js"></script>
<script src="/js/pool-weather.js"></script>
<main id="main">
  <div class="card"><p>Loading…</p></div>
</main>
<footer>Powered by <a href="https://poolsideapp.com">Poolside</a></footer>

<script>
const SUPABASE_URL = 'https://sdewylbddkcvidwosgxo.supabase.co';
const AUTH_URL     = `${SUPABASE_URL}/functions/v1/tenant_admin_auth`;
const SETTINGS_URL = `${SUPABASE_URL}/functions/v1/tenant_settings`;
const TASKS_URL    = `${SUPABASE_URL}/functions/v1/admin_tasks`;
const GATE_URL     = `${SUPABASE_URL}/functions/v1/gate_admin`;

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function logout() {
  // Self-healing: don't nuke a valid session on transient errors. Validate
  // the token first; only really log out if it's confirmed bad. Random
  // logouts Doug hit 2026-05-20 came from catch blocks calling logout()
  // on network blips / parse errors / non-200s where the token was fine.
  try {
    const t = localStorage.getItem('poolside_tenant_token');
    if (t) {
      const vr = await fetch('https://sdewylbddkcvidwosgxo.supabase.co/functions/v1/tenant_admin_auth', {
        method: 'POST', headers: { 'content-type': 'application/json', 'authorization': `Bearer ${t}` },
        body: JSON.stringify({ action: 'me' }),
      });
      if (vr.status !== 401) return;  // token still good - caller had a transient bug
    }
  } catch (_) { return; }  // network blip during validation - assume token is fine
  ['poolside_tenant_token','poolside_tenant_user','poolside_tenant_tenant'].forEach(k => localStorage.removeItem(k));
  window.location.href = '/club/admin/login.html';
}

document.getElementById('signout').addEventListener('click', logout);

// Provider impersonation handoff: if the URL hash has a bootstrap=<jwt>
// payload (provider opens us in a new tab via tenants_admin/impersonate),
// move the token into localStorage and reload to a clean URL.
(function bootstrapFromHash() {
  if (!window.location.hash.startsWith('#bootstrap=')) return;
  const tok = decodeURIComponent(window.location.hash.slice('#bootstrap='.length));
  if (!tok) return;
  localStorage.setItem('poolside_tenant_token', tok);
  // Wipe stale user/tenant cache from any previous session — `me` will
  // repopulate them below.
  localStorage.removeItem('poolside_tenant_user');
  localStorage.removeItem('poolside_tenant_tenant');
  // Strip the hash so the token doesn't linger in browser history.
  history.replaceState(null, '', window.location.pathname + window.location.search);
})();

// ── How each kind of task reads in "Needs you" ──────────────────────────
// A short title, an icon, and the one button. The task's own summary is the
// line underneath. Anything not listed reads as a plain to-do.
const TASK_LOOK = [
  [/^payments\.approve_due/,          '💳', 'money', 'Approve upcoming payments', 'Review'],
  [/^(venmo\.claim|party\.venmo_claim|keyfob\.venmo)/, '📲', 'money', 'Venmo to check', 'Check'],
  [/^application\.submitted/,        '📝', '',      'Signup to review',  'Review'],
  [/^application\.(refund|dispute)|^stripe\.refund|^party\.refund/, '💸', 'money', 'Money to sort out', 'Open'],
  [/^plan\.fob_|^keyfob\./,          '🔑', 'fob',   'Keyfob',            'Open'],
  [/^plan\.|^renewal\./,             '💳', 'money', 'Payment plan',      'Open'],
  [/^referral\./,                    '🎁', 'party', 'Referral reward',   'Open'],
  [/^party\.requested/,              '🎉', 'party', 'Party request',     'Decide'],
  [/^help\.request/,                 '💬', 'ask',   'Member question',   'Reply'],
  [/^photo\./,                       '📷', '',      'Photo to approve',  'Review'],
  [/^household/,                     '👪', '',      'Family change',     'Open'],
  [/^meeting\./,                     '🗒️', '',      'Meeting follow-up', 'Open'],
  [/^gate\./,                        '🚪', 'fob',   'Gate',              'Open'],
];
// What comes first: money that's waiting on a tick, then people waiting.
const TASK_ORDER = [/^payments\.approve_due/, /venmo/, /^application\.submitted/, /^help\.request/, /^party\.requested/, /^keyfob\.|^plan\.fob_/];
function taskLook(kind) {
  const hit = TASK_LOOK.find(([re]) => re.test(String(kind || '')));
  return hit ? { icon: hit[1], tone: hit[2], title: hit[3], button: hit[4] } : { icon: '🔔', tone: '', title: 'To do', button: 'Open' };
}
function taskRank(kind) {
  const i = TASK_ORDER.findIndex(re => re.test(String(kind || '')));
  return i < 0 ? TASK_ORDER.length : i;
}

(async () => {
  // Use the shared PoolsideAuth.meOrLogout — only fires logout on a real
  // 401 or session-fatal error, not on every network blip. Random logouts
  // Doug hit during the 2026-05-20 test were caused by the old aggressive
  // catch-all logout pattern.
  let data;
  try { data = await PoolsideAuth.meOrLogout(); }
  catch (e) {
    document.getElementById('main').innerHTML = `<div class="card"><h2>Network error</h2><p>${e.message === 'NETWORK' ? 'Could not reach the server. Check your connection and refresh.' : escapeHtml(e.message)}</p></div>`;
    return;
  }
  if (!data) return;  // already redirected to login.html

  const token = localStorage.getItem('poolside_tenant_token');
  const { user, tenant } = data;

  // First-login forced password change. An invited admin lands here with
  // is_default_pw=true and no other surface to change it. Force them through
  // /change-password.html before they can do anything else.
  // Impersonators bypass (Doug supports without password rituals).
  if (!user.impersonated && user.is_default_pw) {
    window.location.replace('/club/admin/change-password.html');
    return;
  }

  // Gate-attendant role only has 'check_in' + 'shifts' scopes — the rest
  // of the dashboard would be empty for them. Bounce to whichever feature
  // the club actually uses: scheduling first (more useful to the lifeguard
  // personally), check-in as fallback. Impersonators bypass this so Doug
  // can support from within.
  if (!user.impersonated && user.role_template === 'gate_attendant') {
    const features = (tenant && tenant.features) || {};
    if (features.lifeguard_scheduling) {
      window.location.replace('/club/admin/my-shifts.html');
    } else {
      window.location.replace('/club/admin/checkin.html');
    }
    return;
  }

  document.title = `Admin — ${tenant.display_name}`;
  document.getElementById('whoami').textContent = `${user.display_name || user.email}`;
  // Only for admins who are also members — otherwise /m/ would just be a
  // sign-in page they have no account for.
  const memberSwitch = document.getElementById('member-switch');
  if (memberSwitch && user.linked_member_id) memberSwitch.style.display = '';
  if (window.PoolsideFlags) PoolsideFlags.apply((data.tenant && data.tenant.features) || {}, data.user, data.tenant, data.usage);

  // ── The setup checklist (J1) ────────────────────────────────────────
  // One list, from tenant_settings.setup_status. It replaced the setup
  // wizard, the "Finish setting up" page, a second checklist and the
  // founder "sign up your family" card. Every item opens the real settings
  // screen. Other admin pages show a one-line reminder linking to #setup.
  // "Hide for now" folds it to one line; it goes away once everything is
  // done. Hidden while Doug is impersonating a club.
  async function markApplyLinkShared() {
    try {
      await fetch(AUTH_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'mark_onboarding_step', step: 'apply_link_shared' }),
      });
    } catch { /* next load re-syncs */ }
    paintSetupChecklist();
  }

  async function paintSetupChecklist() {
    if (user.impersonated) return;
    let data;
    try {
      const r = await fetch(SETTINGS_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'setup_status' }),
      });
      data = await r.json();
    } catch { return; }
    let card = document.getElementById('setup-card');
    if (!data || !data.ok || data.complete) { if (card) card.remove(); return; }
    if (!card) {
      card = document.createElement('div');
      card.id = 'setup-card';
      // Lives outside <main> (main.innerHTML is replaced on render), so it
      // reproduces main's content box itself.
      card.style.cssText = 'background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a;border-radius:14px;padding:18px 22px;width:calc(100% - 44px);max-width:1036px;margin:18px auto 0';
      const main = document.getElementById('main');
      main.parentNode.insertBefore(card, main);
    }
    let folded = false;
    try { folded = localStorage.getItem('poolside_setup_folded') === '1' && window.location.hash !== '#setup'; } catch (_) {}
    const head = `🎯 Setup: ${data.done} of ${data.total} done`;
    if (folded) {
      card.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <b style="color:#7c2d12">${head}</b>
          <button type="button" id="setup-unfold" style="padding:6px 12px;border-radius:8px;font:600 12px Inter,sans-serif;background:#0a3b5c;color:#fff;border:0;cursor:pointer">Show the list</button>
        </div>`;
    } else {
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px">
          <div>
            <h2 style="margin:0 0 4px;color:#7c2d12">${head}</h2>
            <p style="margin:0;font-size:13px;color:#92400e;line-height:1.5">Each one opens the screen where it's set. Finish these and ${escapeHtml(tenant.display_name)} is ready for members.</p>
          </div>
          <button type="button" id="setup-fold" style="padding:6px 10px;border-radius:8px;font:600 12px Inter,sans-serif;background:transparent;border:0;color:#7c2d12;cursor:pointer;text-decoration:underline">Hide for now</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${data.items.map(it => `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid #fde68a;border-radius:10px">
              <div style="font-size:17px;width:22px;text-align:center;color:${it.done ? '#15803d' : '#92400e'}">${it.done ? '✓' : '☐'}</div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:14px;${it.done ? 'color:#15803d;text-decoration:line-through' : 'color:#0f172a'}">${escapeHtml(it.label)}</div>
                ${it.done ? '' : `<div style="font-size:12px;color:#78350f;margin-top:2px;line-height:1.45">${escapeHtml(it.why || '')}</div>`}
              </div>
              ${it.done ? '' : `<div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
                <a href="${escapeHtml(it.fix_url)}" data-setup="${escapeHtml(it.id)}" style="padding:6px 12px;background:var(--blue);color:#fff;text-decoration:none;border-radius:8px;font:600 12px Inter,sans-serif;white-space:nowrap">${escapeHtml(it.fix_label)} →</a>
                ${it.can_skip ? `<button type="button" data-skip="${escapeHtml(it.id)}" style="padding:6px 10px;border-radius:8px;font:600 12px Inter,sans-serif;background:transparent;border:1.5px solid #fde68a;color:#7c2d12;cursor:pointer;white-space:nowrap">I don't swim here</button>` : ''}
              </div>`}
            </div>`).join('')}
        </div>`;
    }
    const fold = v => { try { localStorage.setItem('poolside_setup_folded', v ? '1' : '0'); } catch (_) {} };
    card.querySelector('#setup-fold')?.addEventListener('click', () => { fold(true); paintSetupChecklist(); });
    card.querySelector('#setup-unfold')?.addEventListener('click', () => { fold(false); paintSetupChecklist(); });
    card.querySelector('[data-skip="self_signup"]')?.addEventListener('click', async () => {
      try {
        await fetch(AUTH_URL, {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'authorization': `Bearer ${token}` },
          body: JSON.stringify({ action: 'dismiss_member_apply' }),
        });
      } catch { /* shows again next load */ }
      paintSetupChecklist();
    });
    // The join-link item points at the signup link at the bottom of this page.
    card.querySelector('[data-setup="share_link"]')?.addEventListener('click', e => {
      const target = document.getElementById('apply-link-card');
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
    if (window.location.hash === '#setup') card.scrollIntoView({ block: 'start' });
  }
  paintSetupChecklist();

  // ── The home, in one call (PLAN.md W) ───────────────────────────────
  // admin_tasks `home`: this person's tasks, and the banner's numbers,
  // today, the week ahead and the quick buttons, all from the screens the
  // President ticked for their position.
  let tdata;
  try {
    const r = await fetch(TASKS_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'authorization': `Bearer ${token}` },
      body: JSON.stringify({ action: 'home' }),
    });
    tdata = await r.json();
    if (!tdata.ok) throw new Error(tdata.error || 'Failed');
    if (!tdata.home) throw new Error('Refresh the page to load the new version.');
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="card"><h2>Couldn't load your page</h2><p>${escapeHtml(e.message === 'Failed to fetch' ? 'Could not reach the server. Check your connection and refresh.' : e.message)}</p></div>`;
    return;
  }
  const home = tdata.home;
  const tasks = tdata.tasks || [];
  // The tab numbers come from these same tasks (no second call).
  if (window.PoolsideNav && PoolsideNav.paintFromTasks) PoolsideNav.paintFromTasks(tasks);

  // ── Times and days ──
  const fmtT = hhmm => { const [h, m] = String(hhmm).split(':').map(Number); return `${h % 12 || 12}${m ? ':' + String(m).padStart(2, '0') : ''} ${h < 12 ? 'AM' : 'PM'}`; };
  const clock = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(':00', '');
  // "10–11:30 AM": one AM/PM when both ends share it.
  const span = (s, e, allDay) => {
    if (allDay) return 'All day';
    if (!e) return clock(s);
    const a = clock(s), b = clock(e), pa = a.slice(-2), pb = b.slice(-2);
    return pa === pb ? `${a.slice(0, -3)}–${b}` : `${a}–${b}`;
  };
  const shortDay = key => PoolTime.fmtDay(key, { weekday: 'short' }) + ' ' + Number(key.slice(5, 7)) + '/' + Number(key.slice(8, 10));
  const days = Array.from({ length: 7 }, (_, i) => PoolTime.addDays(home.today, i));
  const money = c => '$' + Math.round(Number(c || 0) / 100).toLocaleString();

  // Calendar entries for a day: events and programs by the shared rules
  // (js/today.js), plus parties from the bookings (with the family's name
  // for those who handle parties) and today's lifeguard shifts.
  const calEvents = (home.events || []).filter(e => e.kind !== 'party');
  function dayItems(key) {
    const items = PoolsideToday.items(calEvents, key === home.today ? home.programs : [], key)
      .map(i => ({ when: span(i.start, i.end, i.allDay), sort: i.allDay ? 0 : i.start.getTime(), title: i.label, sub: i.location || (i.kind === 'lesson' ? 'Program' : '') }));
    for (const p of (home.parties || []).filter(p => p.pool_date === key)) {
      const s = new Date(p.starts_at), e = p.ends_at ? new Date(p.ends_at) : null;
      items.push({ when: span(s, e, false), sort: s.getTime(), title: p.family ? `${p.title} · ${p.family}` : p.title,
        sub: p.status === 'pending' ? '' : (p.paid ? 'Paid' : 'Not paid yet'), wait: p.status === 'pending', href: '/club/admin/parties.html' });
    }
    if (key === home.today) for (const s of (home.shifts || [])) {
      const st = new Date(s.starts_at), en = s.ends_at ? new Date(s.ends_at) : null;
      const filled = (s.lifeguard_signups || []).filter(x => x.status !== 'released').length;
      items.push({ when: span(st, en, false), sort: st.getTime(), title: 'Lifeguard shift', sub: `${filled} of ${s.spots_needed || 1} signed up`, href: '/club/admin/lifeguards.html' });
    }
    return items.sort((a, b) => a.sort - b.sort);
  }

  // ── The banner ──
  const first = String(user.display_name || '').trim().split(/\s+/)[0] || 'there';
  const titles = (tdata.my_positions || []).map(p => p.title);
  const roleBadge = titles.length ? titles.join(' · ') : (user.board_title || (user.role_template === 'owner' ? 'Owner' : 'Board member'));
  const hrs = PoolTime.hoursFor(home.pool, home.today);
  const todayLine = !home.season_open ? '🏝️ Closed for the season'
    : hrs ? `🕙 Open ${fmtT(hrs.opens)}–${fmtT(hrs.closes)}` : '🚫 Closed today';
  const eventsWeek = days.reduce((n, k) => n + PoolsideToday.items(calEvents, [], k).length, 0);
  const statValue = s => {
    if (s.key === 'events_week') return eventsWeek;
    if (s.key === 'next_meeting') return s.value ? shortDay(s.value) : 'None';
    if (s.money) return money(s.value);
    return s.value == null ? '–' : Number(s.value).toLocaleString();
  };
  const statLabel = s => s.key === 'next_meeting' && !s.value ? 'board meeting planned' : s.label;
  const heroHtml = `
    <section class="hero">
      <div>
        <div class="hero-top"><h1>Hi, ${escapeHtml(first)}!</h1><span class="hero-date">${escapeHtml(new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }))}</span></div>
        <div class="hero-badges"><span class="hb role">${escapeHtml(roleBadge)}</span><span class="hb season">${escapeHtml(String(home.season))} season</span></div>
        <div class="hero-line"><span id="hero-weather"></span><span>${escapeHtml(todayLine)}</span></div>
      </div>
      <div class="hero-stats">${(home.stats || []).map(s => `
        <a class="hs" href="${escapeHtml(s.href)}"><div class="v">${escapeHtml(String(statValue(s)))}</div><div class="l">${escapeHtml(statLabel(s))}</div></a>`).join('')}
      </div>
    </section>`;

  // ── The gate, at the top for everyone who can open it (PLAN.md W2) ──
  const gateHtml = home.gate && home.gate.show ? `
    <section class="card gate" id="gate-card">
      <div class="gi">🚪</div>
      <div class="gt">Front gate${home.gate.online ? '<small>● Online</small>' : '<small class="off">Remote unlock is offline right now. Keyfobs still work.</small>'}<small id="gate-feedback" style="color:var(--muted)"></small></div>
      ${home.gate.online ? '<button type="button" class="hbtn" id="gate-btn">Unlock now</button>' : ''}
    </section>` : '<section class="card gate" id="gate-card" style="display:none"></section>';

  // ── Needs you: their tasks, one button each ──
  const sorted = [...tasks].sort((a, b) => taskRank(a.kind) - taskRank(b.kind) || String(b.created_at).localeCompare(String(a.created_at)));
  const age = t => {
    const h = Math.max(0, Math.floor((Date.now() - new Date(t.created_at).getTime()) / 3600_000));
    return h < 1 ? 'just now' : h < 24 ? `${h}h ago` : `${Math.floor(h / 24)}d ago`;
  };
  const todoRow = t => {
    const look = taskLook(t.kind);
    // A position's alert, for the position they hold, is simply theirs.
    const forWho = t.for_position && titles.includes(t.for_position) ? 'For you' : taskFor(t, tdata.me);
    return `
      <div class="todo">
        <div class="ti ${look.tone}">${look.icon}</div>
        <div class="tt"><b>${escapeHtml(look.title)}</b><span>${escapeHtml(t.summary)}</span>
          <span class="meta">${escapeHtml(age(t))}${forWho === 'For you' ? '' : ' · ' + escapeHtml(forWho)} · <button type="button" onclick="completeTask('${escapeHtml(t.id)}')">Mark done</button></span></div>
        ${t.link_url ? `<a class="hbtn${taskRank(t.kind) < 3 ? '' : ' ghost'}" href="${escapeHtml(t.link_url)}">${look.button}</a>` : ''}
      </div>`;
  };
  const SHOW = 6;
  const needsHtml = `
    <section class="card" id="needs-card">
      <div class="card-h"><h2>Needs you</h2>${tasks.length ? `<span class="count">${tasks.length}</span>` : ''}</div>
      ${tasks.length ? `<div>${sorted.slice(0, SHOW).map(todoRow).join('')}</div>
        ${sorted.length > SHOW ? `<details><summary style="cursor:pointer;font:600 13px Inter,sans-serif;color:var(--blue);padding-top:8px">Show ${sorted.length - SHOW} more</summary><div>${sorted.slice(SHOW).map(todoRow).join('')}</div></details>` : ''}`
        : '<div class="placeholder">✓ All caught up. Nothing is waiting on you.</div>'}
    </section>`;

  // ── Today at the pool, and the week ahead ──
  const evRow = i => `<div class="ev"><div class="when">${escapeHtml(i.when)}</div><div class="what">${escapeHtml(i.title)}${i.sub ? `<small>${escapeHtml(i.sub)}</small>` : ''}</div>${i.wait ? `<a class="tag wait" href="${escapeHtml(i.href || '#')}">Waiting on you</a>` : ''}${i.tag || ''}</div>`;
  const todayItems = dayItems(home.today);
  const coming = [];
  for (const k of days.slice(1)) for (const i of dayItems(k)) coming.push({ ...i, when: shortDay(k), key: k, title: i.title, sub: [i.when, i.sub].filter(Boolean).join(' · ') });
  if (home.charge_day) {
    const c = home.charge_day;
    coming.push({ key: c.date, when: shortDay(c.date), title: `Plan payments, ${money(c.cents)}`, sub: `${c.count} famil${c.count === 1 ? 'y' : 'ies'}`,
      wait: c.waiting > 0, href: '/club/admin/upcoming.html', tag: c.waiting ? '' : '<span class="tag">Approved</span>' });
  }
  if (home.next_meeting) {
    const m = home.next_meeting;
    coming.push({ key: m.date, when: shortDay(m.date), title: `Board meeting${m.time ? ', ' + fmtT(m.time) : ''}`, sub: m.agenda ? 'The agenda is ready' : 'Add to the agenda anytime',
      tag: `<a class="hbtn ghost" style="padding:6px 12px;font-size:12.5px" href="/club/admin/board-meetings.html${m.agenda ? '' : '#add'}">${m.agenda ? 'Agenda' : 'Add'}</a>` });
  }
  coming.sort((a, b) => String(a.key).localeCompare(String(b.key)));
  const todayHtml = `
    <section class="card" id="today-card">
      <div class="card-h"><h2>Today at the pool</h2></div>
      ${todayItems.length ? `<div>${todayItems.map(evRow).join('')}</div>` : `<div style="font-size:14px;color:var(--muted)">${home.season_open ? 'Nothing on the calendar today.' : 'The pool is closed for the season.'}</div>`}
      ${coming.length ? `<div class="sub-h">Coming up</div><div>${coming.slice(0, 6).map(evRow).join('')}</div>` : ''}
    </section>`;

  // ── Quick buttons, their job, the signup link ──
  const quickHtml = `
    <section class="card" id="quick-card">
      <div class="card-h"><h2>Quick actions</h2></div>
      <div class="qa">${(home.quick || []).map(q => `<a href="${escapeHtml(q.href)}"><span>${q.icon}</span>${escapeHtml(q.label)}</a>`).join('')}</div>
    </section>`;
  const applyUrl = `https://${tenant.slug}.poolsideapp.com/apply.html`;
  const rowsHtml = `
    <section class="card rows" id="more-card">
      ${titles.length ? `<details id="my-job"><summary>👔 Your job as ${escapeHtml(titles.join(' and '))} <span class="arr">›</span></summary><div class="job" id="my-job-body"></div></details>` : ''}
      <a href="/club/admin/board-meetings.html#start">▶️ Start a board meeting <span class="arr">›</span></a>
      <a href="/club/admin/board-meetings.html#add">🗒️ Add to the next agenda <span class="arr">›</span></a>
      <a href="/club/admin/board.html">👥 The whole board <span class="arr">›</span></a>
      ${home.signup_link ? `<div class="row" id="apply-link-card" data-focus="apply-link">🔗 Signup link for new families <button type="button" class="copy" id="apply-link-copy">Copy</button></div>` : ''}
    </section>`;

  document.getElementById('main').innerHTML = `
    ${heroHtml}
    ${gateHtml}
    <div class="layout">
      <div class="col left">
        <div id="push-prompt" style="display:none;margin-bottom:16px"></div>
        ${needsHtml}
        ${todayHtml}
      </div>
      <div class="col right">
        ${quickHtml}
        ${rowsHtml}
      </div>
    </div>`;

  if (home.pool && home.pool.location) PoolWeather.load(home.pool.location, document.getElementById('hero-weather'));
  paintMyJob(tdata);

  // The signup link: copy it, and tick the setup step.
  document.getElementById('apply-link-copy')?.addEventListener('click', async e => {
    const btn = e.currentTarget;
    try { await navigator.clipboard.writeText(applyUrl); btn.textContent = '✓ Copied'; }
    catch { window.prompt('Copy the signup link:', applyUrl); }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
    markApplyLinkShared();
  });

  // The gate: one tap opens it.
  document.getElementById('gate-btn')?.addEventListener('click', async e => {
    const btn = e.currentTarget, fb = document.getElementById('gate-feedback');
    btn.disabled = true; btn.textContent = 'Opening…'; fb.textContent = '';
    try {
      const r = await fetch(GATE_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'board_unlock' }),
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'Unlock failed');
      fb.style.color = 'var(--green)'; fb.textContent = '✓ The gate should open in a moment.';
    } catch (err) {
      fb.style.color = 'var(--red)'; fb.textContent = err.message || 'Unlock failed';
    } finally {
      btn.disabled = false; btn.textContent = 'Unlock now';
    }
  });

  // The phone pop-ups prompt (admin-push.js builds its own markup). For
  // someone member-help questions come to, with no device getting pop-ups,
  // it can't be dismissed. admin-push.js is deferred, so wait for it.
  const mountPush = () => window.AdminPush && window.AdminPush.mountPrompt(document.getElementById('push-prompt'), {
    mustFor: tdata.help_topics_mine || [],
    devices: tdata.push_devices,
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountPush);
  else mountPush();
})();

// Who a task is for: one board member, a board position, a role, or the president.
function taskFor(t, me) {
  if (t.assigned_admin_id) return t.assigned_admin_id === me ? 'For you' : `For ${t.assigned_name || 'a board member'}`;
  if (t.for_position) return `For the ${t.for_position}`;
  return (t.target_scopes || []).length ? 'For the board' : 'For the President';
}

// "Your job": the positions this board member holds, with the purpose up
// front and the full job description (PLAN.md K4).
function paintMyJob(tdata) {
  const body = document.getElementById('my-job-body');
  const mine = (tdata && tdata.my_positions) || [];
  if (!body || !mine.length) return;
  const line = l => {
    const t = l.trim(), m = t.match(/^([^:]{2,40}):\s(.*)$/);
    const inner = m && !/^\d+\./.test(t) ? `<b>${escapeHtml(m[1])}:</b> ${escapeHtml(m[2])}` : escapeHtml(t);
    return `<p style="margin:0 0 6px${/^\s+/.test(l) ? ';margin-left:18px' : ''}">${inner}</p>`;
  };
  body.innerHTML = mine.map(p => `
      ${mine.length > 1 ? `<p style="margin:8px 0 4px;font-weight:700">${escapeHtml(p.title)}</p>` : ''}
      ${p.purpose ? `<p style="margin:0 0 8px">${escapeHtml(p.purpose)}</p>` : ''}
      ${p.description ? String(p.description).split('\n').filter(l => l.trim()).map(line).join('') : ''}`).join('')
    + (tdata.spending_rule ? `<p style="font-size:12.5px;color:var(--muted);margin:10px 0 0"><b>Spending rule:</b> ${escapeHtml(tdata.spending_rule)}</p>` : '');
}

async function completeTask(id) {
  const t = localStorage.getItem('poolside_tenant_token');
  await fetch(`${SUPABASE_URL}/functions/v1/admin_tasks`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'authorization': `Bearer ${t}` },
    body: JSON.stringify({ action: 'complete', id }),
  });
  window.location.reload();
}
</script>
</body>
</html>
