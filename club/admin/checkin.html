<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool check-in — Poolside</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a3b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pool check-in">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#0a3b5c; --blue-2:#134b73; --blue-l:#e6eef5; --sun:#f59e0b;
    --bg:#fefdfb; --bg-2:#f7f3eb; --text:#0f172a; --muted:#64748b;
    --border:#e5e7eb; --green:#16a34a; --red:#dc2626; --amber:#92400e;
    --shadow: 0 1px 2px rgba(10,59,92,.04), 0 8px 24px rgba(10,59,92,.06);
  }
  *,*::before,*::after { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.4 'Inter',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  header { padding:14px 20px; background:var(--blue); color:#fff; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(10,59,92,.18) }
  header h1 { margin:0; font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:20px; letter-spacing:-.015em }
  header .stats { font-size:13px; opacity:.9; font-variant-numeric:tabular-nums }
  header .signout { color:#fff; opacity:.7; font-size:12px; cursor:pointer; text-decoration:underline; margin-left:14px }
  main { flex:1; padding:18px 16px 100px; max-width:980px; width:100%; margin:0 auto }
  .search-bar { display:flex; gap:10px; margin-bottom:16px; position:sticky; top:0; padding:12px 0; background:var(--bg); z-index:50; border-bottom:1px solid var(--border) }
  .search-bar input { flex:1; padding:18px 22px; font:600 22px 'Inter',sans-serif; border:2px solid var(--blue); border-radius:14px; background:#fff }
  .search-bar input:focus { outline:0; border-color:var(--sun); box-shadow:0 0 0 4px rgba(245,158,11,.18) }
  .hh-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:12px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; box-shadow:var(--shadow) }
  .hh-card.paid { border-color:#86efac; border-width:2px }
  .hh-card.unpaid { border-color:#fecaca; border-width:2px; background:#fffafa }
  .hh-name { font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:22px; color:var(--blue); min-width:200px; flex:1 }
  .hh-members { font-size:13.5px; color:var(--muted); margin-top:4px }
  .pill { display:inline-block; padding:5px 12px; border-radius:999px; font:700 11.5px Inter; letter-spacing:.04em; text-transform:uppercase }
  .pill.paid   { background:#dcfce7; color:#14532d }
  .pill.unpaid { background:#fee2e2; color:#7f1d1d }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .actions input[type=number] { width:64px; padding:8px 10px; font:600 15px Inter; border:1px solid var(--border); border-radius:8px; text-align:center }
  .actions label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:2px }
  .btn { padding:13px 22px; border-radius:12px; font:700 15px Inter; cursor:pointer; border:0; background:var(--blue); color:#fff; min-width:120px }
  .btn:active { background:var(--blue-2) }
  .btn:disabled { opacity:.5; cursor:not-allowed }
  .btn.success { background:var(--green) }
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); padding:14px 26px; background:var(--green); color:#fff; border-radius:14px; font:700 16px Inter; box-shadow:0 8px 28px rgba(22,163,74,.5); z-index:1000; opacity:0; transition:opacity .25s }
  .toast.show { opacity:1 }
  .empty { padding:40px 20px; text-align:center; color:var(--muted); font-size:15px }
  .err { padding:10px 14px; border-radius:10px; background:#fee2e2; color:#7f1d1d; border:1px solid #fecaca; font-size:13.5px; margin:8px 0; display:none }
  .err.show { display:block }
</style>
</head>
<body>
<header>
  <h1 id="club-name">Pool check-in</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="stats"><b id="capacity-now">0</b> in pool · <span id="today-total">0</span> today</div>
    <span class="signout" id="signout">Sign out</span>
  </div>
</header>

<main>
  <div class="search-bar">
    <input id="q" type="search" placeholder="🔍 Search by family name, member, or last 4 of phone…" autocomplete="off" autocapitalize="none" autocorrect="off">
  </div>
  <div id="err" class="err"></div>
  <div id="results"><div class="empty">Type a family name to start.</div></div>
</main>

<div id="toast" class="toast">✓ Checked in</div>

<script>
const SUPABASE_URL = 'https://sdewylbddkcvidwosgxo.supabase.co';
const CHECKINS_URL = `${SUPABASE_URL}/functions/v1/checkins`;
const AUTH_URL     = `${SUPABASE_URL}/functions/v1/tenant_admin_auth`;
function token() { return localStorage.getItem('poolside_tenant_token'); }
function logout() { ['poolside_tenant_token','poolside_tenant_user','poolside_tenant_tenant'].forEach(k => localStorage.removeItem(k)); window.location.href = '/club/admin/login.html'; }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('signout').addEventListener('click', logout);

async function call(action, body) {
  const r = await fetch(CHECKINS_URL, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'authorization': `Bearer ${token()}` },
    body: JSON.stringify({ action, ...(body || {}) }),
  });
  return r.json();
}

let CAPACITY = { in_pool_now: 0, today_total: 0 };
async function refreshCapacity() {
  try {
    const r = await call('capacity');
    if (r.ok) {
      CAPACITY = r;
      document.getElementById('capacity-now').textContent = r.in_pool_now;
      document.getElementById('today-total').textContent = r.today_total;
    }
  } catch {}
}
function showToast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? 'var(--green)' : 'var(--red)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

let RESULTS = [];
function render() {
  const list = document.getElementById('results');
  if (!RESULTS.length) {
    list.innerHTML = '<div class="empty">No matches. Try a different name or last 4 of phone.</div>';
    return;
  }
  list.innerHTML = RESULTS.map(h => {
    const paid = !!h.dues_paid_for_year;
    const memberList = (h.members || []).map(m => escapeHtml(m.name)).join(' · ');
    return `
      <div class="hh-card ${paid ? 'paid' : 'unpaid'}">
        <div style="flex:1;min-width:220px">
          <div class="hh-name">${escapeHtml(h.family_name || 'Unknown family')}</div>
          ${memberList ? `<div class="hh-members">${memberList}</div>` : ''}
          <div style="margin-top:6px"><span class="pill ${paid ? 'paid' : 'unpaid'}">${paid ? '✓ Paid' : '⚠ Unpaid'}</span></div>
        </div>
        <div class="actions">
          <label>Family<input type="number" min="1" max="20" value="${(h.members || []).length || 1}" data-role="party" data-hh="${escapeHtml(h.id)}"></label>
          <label>Guests<input type="number" min="0" max="20" value="0" data-role="guests" data-hh="${escapeHtml(h.id)}"></label>
          <button class="btn ${paid ? 'success' : ''}" data-hh="${escapeHtml(h.id)}" data-family="${escapeHtml(h.family_name || '')}" onclick="checkIn(this)">${paid ? '✓ Check in' : 'Check in — unpaid'}</button>
        </div>
      </div>`;
  }).join('');
}

window.checkIn = async function(btn) {
  const hid = btn.dataset.hh;
  const family = btn.dataset.family;
  const partyEl  = document.querySelector(`input[data-role="party"][data-hh="${hid.replace(/"/g,'\\"')}"]`);
  const guestsEl = document.querySelector(`input[data-role="guests"][data-hh="${hid.replace(/"/g,'\\"')}"]`);
  const party_size  = Math.max(1, Number(partyEl?.value) || 1);
  const guest_count = Math.max(0, Number(guestsEl?.value) || 0);
  btn.disabled = true; const orig = btn.textContent; btn.textContent = '…';
  try {
    const r = await call('log_entry', { household_id: hid, party_size, guest_count, method: 'lifeguard' });
    if (!r.ok) throw new Error(r.error || 'Failed');
    showToast(`✓ ${family} — checked in (${party_size + guest_count})`);
    btn.textContent = '✓ Done';
    btn.style.background = 'var(--green)';
    refreshCapacity();
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.background = ''; }, 1800);
  } catch (e) {
    showToast(e.message, false);
    btn.disabled = false; btn.textContent = orig;
  }
};

let SEARCH_TIMER = null;
async function search(q) {
  try {
    const r = await call('search', { q });
    if (!r.ok) {
      document.getElementById('err').textContent = r.error || 'Search failed';
      document.getElementById('err').classList.add('show');
      RESULTS = [];
    } else {
      document.getElementById('err').classList.remove('show');
      RESULTS = r.households || [];
    }
    render();
  } catch (e) {
    document.getElementById('err').textContent = e.message;
    document.getElementById('err').classList.add('show');
  }
}

document.getElementById('q').addEventListener('input', () => {
  const v = document.getElementById('q').value;
  if (SEARCH_TIMER) clearTimeout(SEARCH_TIMER);
  SEARCH_TIMER = setTimeout(() => search(v), 220);
});

(async () => {
  if (!token()) { logout(); return; }
  try {
    const r = await fetch(AUTH_URL, { method:'POST', headers:{'content-type':'application/json','authorization':`Bearer ${token()}`}, body:JSON.stringify({action:'me'}) });
    const d = await r.json();
    if (!d.ok) { logout(); return; }
    document.title = `Check-in — ${d.tenant.display_name}`;
    document.getElementById('club-name').textContent = `🏊 ${d.tenant.display_name}`;
  } catch { logout(); }
  await refreshCapacity();
  await search('');
  // Refresh capacity every 60s in case multiple lifeguards are checking in
  setInterval(refreshCapacity, 60_000);
})();
</script>
</body>
</html>
