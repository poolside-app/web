# Functions that handle their own auth (verify HS256 admin tokens themselves)
# need to opt out of the gateway's JWT check, otherwise the gateway rejects
# the admin tokens we sign because they're not signed with Supabase's key.

# (List grows as we add Edge Functions in later migrations.)

[functions.admin_auth]
verify_jwt = false

[functions.tenants_admin]
verify_jwt = false

# Public — no auth required, this is the signup form
[functions.tenant_signup]
verify_jwt = false

# Public — tenant landing pages call this to get display_name etc.
[functions.tenant_public]
verify_jwt = false

# Per-tenant admin login — verifies bcrypt + signs HS256 JWT itself
[functions.tenant_admin_auth]
verify_jwt = false

# Per-tenant admin reads/writes — auth verified inside the function
[functions.tenant_settings]
verify_jwt = false

# Per-tenant image uploads (background photos, logos) → club-assets bucket
[functions.tenant_upload]
verify_jwt = false

# Households + members CRUD scoped to the tenant on the auth token
[functions.households_admin]
verify_jwt = false

# Per-tenant announcement posts shown on the public landing page
[functions.posts_admin]
verify_jwt = false

# Per-tenant calendar entries (parties, swim meets, closures, etc.)
[functions.events_admin]
verify_jwt = false

# Public iCal feed — no auth, returns text/calendar so members can subscribe
[functions.tenant_calendar_ics]
verify_jwt = false

# Member-facing email magic-link auth (start / verify / me / logout)
[functions.member_auth]
verify_jwt = false

# Per-tenant photo gallery CRUD; uploads go through tenant_upload first
[functions.photos_admin]
verify_jwt = false

# Admin-side party booking review (approve / reject / admin-cancel)
[functions.parties_admin]
verify_jwt = false

# ICS calendar import — subscriptions stored in settings.value.calendar_imports
[functions.events_import]
verify_jwt = false

# Aggregated time-saved / dollar-value metrics for the Impact admin page
[functions.tenant_metrics]
verify_jwt = false

# Per-tenant documents (handbook, applications, financials)
[functions.documents_admin]
verify_jwt = false

# Membership applications: public submit + admin review
[functions.applications]
verify_jwt = false

# Network-wide metrics for the provider analytics dashboard
[functions.provider_metrics]
verify_jwt = false

# Per-tenant audit log reader (writes happen inline in other functions)
[functions.audit_admin]
verify_jwt = false

# Bookings engine — programs (swim lessons, yoga, camp) + member sign-ups.
# Mixed surface: public list / member book / admin manage — all in one fn.
[functions.programs]
verify_jwt = false

# In-app pop-up campaigns: announcements / events / fundraisers shown as
# a modal on app open. Public list + tenant_admin CRUD.
[functions.campaigns]
verify_jwt = false

# Volunteer opportunities — one-shot signup slots (snack-bar shifts, party
# helpers, swim-meet timers). Public list + member signup + admin manage.
[functions.volunteer]
verify_jwt = false

# Guest pass packs (punch-card model) + redemption log. Atomic decrement
# via optimistic UPDATE … WHERE used_count = X to prevent over-redemption.
[functions.guest_passes]
verify_jwt = false

# Unified "who owes what" rollup across applications, programs, passes, dues.
[functions.payments_admin]
verify_jwt = false

# Editable per-tenant apply-form policies (rules, guest, party, sitter,
# waiver, plus any custom ones the club adds). Public list_public + admin CRUD.
[functions.policies]
verify_jwt = false

# Google OAuth — sign-in-with-Google for members + tenant admins
[functions.google_oauth]
verify_jwt = false

# Stripe Connect onboarding for tenants (per-tenant Stripe account)
[functions.stripe_connect]
verify_jwt = false

# Stripe Checkout session creation for application/program/pass payments
[functions.stripe_checkout]
verify_jwt = false

# Stripe webhook handler (signs verified inside the function)
[functions.stripe_webhook]
verify_jwt = false

# Admin task queue — board-member to-do list, scoped by role.
# Filters tasks by caller's scopes; owner-role admins see everything.
[functions.admin_tasks]
verify_jwt = false

# Renewals — season-open dues blast (email/SMS) to prior members,
# plus early-bird discount config. Admin auth via custom HS256 JWT,
# so the gateway must not pre-verify Supabase auth tokens.
[functions.renewals]
verify_jwt = false

# Google Drive sync — admin-side OAuth + per-application archival to
# the club's own Drive (drive.file scope). Append-only, one-way.
# OAuth callback arrives as GET so the gateway must not require JWT.
[functions.google_drive_sync]
verify_jwt = false

# Payment plans — split-installment dues + auto-charge cron + lapse handling.
# cron_run action gated by CRON_SECRET header, admin actions by tenant JWT.
[functions.payment_plans]
verify_jwt = false

# Email templates — admin CRUD over per-tenant overrides for system emails.
# Reads from the in-code EMAIL_REGISTRY; writes to email_templates table.
[functions.email_templates]
verify_jwt = false

# Admin Health — single-page diagnostic dashboard. Auth verified inside.
[functions.admin_health]
verify_jwt = false

# Help-center analytics — admin events (searches, article views, etc.).
# Auth verified inside via shared verifyTenantAdmin.
[functions.help_track]
verify_jwt = false

# Gate add-on — keyfob-panel integration. Three functions:
#   gate_admin: tenant + provider config (auth verified inside).
#   unlock_gate: member's "tap to unlock" + status poll (member JWT inside).
#   gate_bridge: Pi polling protocol — auths via X-Bridge-Id + X-Bridge-Secret
#     headers (no JWT — the bridge can't refresh on its own, the secret IS
#     the credential). MUST opt out of the Supabase gateway's JWT check.
[functions.gate_admin]
verify_jwt = false

[functions.unlock_gate]
verify_jwt = false

[functions.gate_bridge]
verify_jwt = false

# Refer-a-friend rewards engine. Auth verified inside (member JWT for
# get_my_code/claim_reward, admin JWT for list, service-internal for
# verify_referral fired by stripe_webhook + applications.verify_payment).
[functions.referrals]
verify_jwt = false

# Per-tenant Web App Manifest for PWA install. Public, fetched by browsers
# at /manifest.webmanifest via a Vercel rewrite that forwards the slug.
[functions.tenant_manifest]
verify_jwt = false

# Anonymous feedback box. submit is public (no auth — anyone can report a
# pool issue without identifying themselves); list/update_status verify a
# tenant_admin token inside the function.
[functions.feedback]
verify_jwt = false

# Tenant-admin sponsor CRUD. List for the public surface goes through
# tenant_public to keep the home-page round-trip count low.
[functions.sponsors_admin]
verify_jwt = false

# Fundraiser donations — public start_checkout for Stripe-paid donations,
# public list_public for the home leaderboard, admin actions for manual
# Venmo/cash entries. Auth verified inside.
[functions.donations]
verify_jwt = false

# Web Push for admin PWA notifications. subscribe/unsubscribe verify a
# tenant_admin token inside; send_scoped is server-to-server with the
# x-poolside-internal=SERVICE_ROLE header.
[functions.push_admin]
verify_jwt = false

# Secretary's board-meeting note-taking surface. Mixed: list_public is
# anonymous (members see public meeting minutes on /governance.html);
# admin actions require the 'meetings' scope.
[functions.board_meetings]
verify_jwt = false

# Internal smoke utility — fires a one-off test SMS via Twilio. Gated by
# SMOKE_SECRET header so anon-key alone cannot trigger sends.
[functions.smoke_sms]
verify_jwt = false

# External iCal feed sync (Google Calendar, Swimtopia, etc.). Auth verified
# inside via tenant_admin JWT — admin's token uses ADMIN_JWT_SECRET (HS256),
# not Supabase's gateway key, so we MUST opt out of the gateway's JWT check
# or every call returns 401 before the function runs. Symptom: "could not
# load that section" or "session expired" on the calendar page when adding
# an iCal feed (Doug 2026-05-21).
[functions.external_calendar]
verify_jwt = false

# Households CSV importer — auth verified inside via tenant_admin JWT
[functions.households_import]
verify_jwt = false

# Pool-entry check-in (lifeguard PWA + member pool-pass entry log). Auth
# verified inside via tenant_admin JWT + check_in scope.
[functions.checkins]
verify_jwt = false

# Lifeguard scheduling — roster + shifts + signups. Auth verified inside
# (admin-level scopes for management; 'shifts' scope for lifeguard self-service).
[functions.lifeguards]
verify_jwt = false
